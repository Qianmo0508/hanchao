<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>寒潮预警</title>
<style>
:root{
  --bg:#0a1220;--bg-2:#0f1a2e;--card:#16233a;--card-2:#1d2f4a;
  --line:rgba(120,170,230,.14);--line-2:rgba(120,170,230,.26);
  --text:#e8f1ff;--text-2:#8fa6c4;--text-3:#5c7089;
  --tint:#5aa9ff;--tint-2:#3b82f6;--ice:#7fd8ff;--frost:#cfe6ff;
  --glow:0 0 24px rgba(90,169,255,.35);
  --blue-warn:#3aa0ff;--yellow:#ffd24a;--orange:#ff9a3c;--red:#ff5a5a;--green:#34c759;
  --warm:#e8e2d8;
  --r:16px;--r-s:10px;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05080f;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#device{
  width:390px;height:844px;position:relative;overflow:hidden;border-radius:44px;
  background:var(--bg);transform-origin:center center;
  box-shadow:0 0 0 10px #060a12,0 0 0 12px #1a2434,0 30px 80px rgba(0,0,0,.75);
}
#device.reduce-motion .temp-breathe,
#device.reduce-motion .page{animation:none!important;transition:none!important;}
#device.reduce-motion .shake{animation:none!important;}

/* wallpaper */
#wallpaper{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 20% 8%,rgba(90,169,255,.18),transparent 55%),
    radial-gradient(ellipse at 85% 85%,rgba(127,216,255,.10),transparent 50%),
    linear-gradient(180deg,#0d1a30 0%,#0a1220 60%,#070d18 100%);}
#wallpaper::after{content:"";position:absolute;inset:0;
  background:
    repeating-conic-gradient(from 0deg at 30% 40%,rgba(200,230,255,.035) 0deg 2deg,transparent 2deg 9deg),
    repeating-linear-gradient(45deg,rgba(200,230,255,.02) 0 1px,transparent 1px 7px);
  mix-blend-mode:screen;opacity:.9;}

/* statusbar */
#statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  font-size:13px;font-weight:600;letter-spacing:.2px;pointer-events:none;}
#statusbar .sb-left{display:flex;align-items:center;gap:8px;}
#statusbar .sb-right{display:flex;align-items:center;gap:8px;}
#statusbar .sb-temp{color:var(--ice);font-variant-numeric:tabular-nums;}
.temp-breathe{animation:breathe 4s var(--ease) infinite;}
@keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}
#warnbar{position:absolute;top:0;left:0;right:0;height:2px;z-index:41;
  background:linear-gradient(90deg,var(--orange),var(--red));
  box-shadow:0 0 12px rgba(255,120,60,.55);}

/* lock */
#lock-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;padding:76px 26px 40px;transition:opacity .4s var(--ease),transform .4s var(--ease);}
#lock-screen.hide{opacity:0;transform:translateY(-36px);pointer-events:none;}
.lock-time{font-size:74px;font-weight:200;letter-spacing:-2px;line-height:1;
  color:var(--frost);text-shadow:0 2px 30px rgba(127,216,255,.25);}
.lock-date{margin-top:10px;font-size:14px;color:var(--text-2);letter-spacing:.6px;}
.lock-temp{margin-top:26px;font-size:26px;font-weight:300;color:var(--ice);letter-spacing:1px;}
.lock-temp small{font-size:12px;color:var(--text-3);margin-left:6px;letter-spacing:0;}
.lock-notifs{margin-top:38px;width:100%;display:flex;flex-direction:column;gap:10px;}
.lock-notif{background:rgba(22,35,58,.72);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 0 0 1px rgba(207,230,255,.03);}
.ln-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;
  color:var(--text-3);margin-bottom:4px;}
.ln-app{color:var(--tint);font-weight:600;letter-spacing:.3px;}
.ln-body{font-size:13px;color:var(--text);line-height:1.45;}
.lock-hint{margin-top:auto;font-size:12px;color:var(--text-3);letter-spacing:3px;
  animation:floatHint 2.6s var(--ease) infinite;}
@keyframes floatHint{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:.9;transform:translateY(-4px)}}

/* keypad */
.keypad-wrap{position:absolute;inset:0;z-index:21;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 40px 60px;
  background:rgba(8,14,26,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.keypad-name{font-size:15px;color:var(--text-2);margin-bottom:14px;letter-spacing:.5px;}
.keypad-dots{display:flex;gap:16px;margin-bottom:44px;height:14px;}
.kdot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--text-3);transition:all .15s var(--ease);}
.kdot.on{background:var(--frost);border-color:var(--frost);box-shadow:0 0 12px rgba(207,230,255,.6);}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:18px;}
.kbtn{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);
  background:rgba(22,35,58,.7);color:var(--frost);font-size:26px;font-weight:300;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .12s var(--ease);font-family:inherit;}
.kbtn:active{background:var(--card-2);transform:scale(.94);}
.kbtn.ghost{visibility:hidden;}
.kbtn.del{font-size:15px;color:var(--text-2);}
.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* home */
#home{position:absolute;inset:0;z-index:1;padding-top:52px;display:flex;flex-direction:column;
  opacity:1;transition:opacity .3s var(--ease);}
.home-pages{flex:1;display:flex;overflow:hidden;position:relative;}
.dpage{min-width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:98px;padding:14px 18px;align-content:start;gap:4px 0;
  transition:transform .34s var(--ease);}
.app-icon{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;font-family:inherit;padding:0;}
.app-icon:active .glyph{transform:scale(.9);}
.glyph{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  position:relative;transition:transform .14s var(--ease);
  box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);}
.glyph .ic{width:30px;height:30px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
.app-icon .label{font-size:10.5px;color:var(--text);letter-spacing:.2px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;
  justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg);}
.page-dots{display:flex;justify-content:center;gap:7px;padding:6px 0 10px;}
.pdot{width:6px;height:6px;border-radius:50%;background:rgba(143,166,196,.35);transition:all .2s;}
.pdot.on{background:var(--frost);box-shadow:0 0 8px rgba(207,230,255,.7);}
.dock{margin:0 16px 26px;height:76px;border-radius:24px;
  background:rgba(22,35,58,.58);border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:space-around;padding:0 12px;}
.dock .app-icon .label{display:none;}
.dock .glyph{width:52px;height:52px;border-radius:15px;}

/* pages */
#pages-layer{position:absolute;inset:0;z-index:5;pointer-events:none;}
.page{position:absolute;inset:0;background:var(--bg-2);pointer-events:auto;
  display:flex;flex-direction:column;padding-top:44px;
  transform:translateX(100%);transition:transform .32s var(--ease);will-change:transform;}
.page.in{transform:translateX(0);}
.page.under{transform:translateX(-24%);filter:brightness(.6);}
.nav{height:50px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;border-bottom:1px solid var(--line);flex-shrink:0;
  background:rgba(15,26,46,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.nav-title{font-size:16px;font-weight:600;letter-spacing:.3px;}
.nav-btn{width:40px;height:40px;border:0;background:none;color:var(--tint);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;
  font-family:inherit;font-size:13px;}
.nav-btn:active{background:rgba(90,169,255,.12);}
.nav-btn .ic{width:22px;height:22px;}
.nav-btn.ghost{pointer-events:none;color:var(--text-3);}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 30px;scrollbar-width:none;}
.body::-webkit-scrollbar{display:none;}

/* generic */
.section-title{font-size:11px;color:var(--text-3);letter-spacing:1px;margin:20px 4px 8px;
  text-transform:uppercase;font-weight:600;}
.section-title:first-child{margin-top:4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(207,230,255,.02);}
.card.flat{background:transparent;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;}
.row:last-child{border-bottom:0;}
.row .rv{color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:6px;}
.row:active{background:rgba(90,169,255,.05);}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .14s var(--ease);}
.btn.primary{background:linear-gradient(160deg,var(--tint),var(--tint-2));color:#fff;
  box-shadow:var(--glow);}
.btn.primary:active{transform:scale(.97);}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--text);}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);}
.input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:11px;
  padding:12px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;}
.input:focus{border-color:var(--tint);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;color:var(--text-3);gap:12px;text-align:center;}
.empty .ic{width:40px;height:40px;opacity:.5;}
.empty p{margin:0;font-size:13px;}
.empty .dim{font-size:11.5px;opacity:.6;}
.dim{color:var(--text-3);}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

/* chat list */
.chat-item{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;align-items:center;}
.chat-item:active{background:rgba(90,169,255,.05);}
.avatar{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);position:relative;}
.avatar.offline{filter:grayscale(1) brightness(.6);}
.chat-main{flex:1;min-width:0;}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.chat-name{font-size:14.5px;font-weight:600;}
.chat-time{font-size:11px;color:var(--text-3);flex-shrink:0;}
.chat-prev{font-size:12.5px;color:var(--text-2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-prev.warn{color:var(--orange);}
.chat-prev.fail{color:var(--red);}
.pin-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--text-2);box-shadow:0 0 0 2px var(--bg-2);}

/* chat room */
.chat-scroll{padding:16px 14px 20px;}
.chat-day{text-align:center;font-size:11px;color:var(--text-3);margin:14px 0 12px;letter-spacing:.5px;}
.msg{display:flex;margin-bottom:12px;gap:8px;align-items:flex-end;}
.msg.me{flex-direction:row-reverse;}
.msg-av{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;}
.msg-bubble{max-width:74%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;
  word-break:break-word;position:relative;}
.msg.them .msg-bubble{background:var(--card-2);border-bottom-left-radius:5px;color:var(--text);}
.msg.me .msg-bubble{background:linear-gradient(160deg,var(--tint),var(--tint-2));color:#fff;
  border-bottom-right-radius:5px;box-shadow:0 4px 14px rgba(59,130,246,.3);}
.msg-time{font-size:10px;color:var(--text-3);margin-top:5px;text-align:center;}
.msg.system{justify-content:center;}
.msg.system .msg-bubble{background:transparent;color:var(--text-3);font-size:11.5px;
  text-align:center;max-width:90%;}
.msg.system.error .msg-bubble{color:var(--red);}
/* mom warm */
.msg.them.warm .msg-bubble{background:rgba(232,226,216,.14);color:var(--warm);
  border:1px solid rgba(232,226,216,.18);}
.mom-banner{background:rgba(232,226,216,.07);border:1px solid rgba(232,226,216,.16);
  border-radius:10px;padding:9px 12px;font-size:11.5px;color:var(--text-2);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.mom-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);}
.chat-input-bar{flex-shrink:0;display:flex;gap:10px;padding:10px 14px 22px;
  border-top:1px solid var(--line);background:rgba(15,26,46,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--line-2);border-radius:20px;
  padding:10px 16px;color:var(--text);font-size:14px;font-family:inherit;outline:none;}
.chat-input:focus{border-color:var(--tint);}
.chat-send{width:42px;height:42px;border-radius:50%;border:0;flex-shrink:0;
  background:linear-gradient(160deg,var(--tint),var(--tint-2));color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(59,130,246,.35);}
.chat-send:active{transform:scale(.94);}
.chat-send .ic{width:19px;height:19px;}

/* rules */
.rule-ver{display:flex;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  margin-bottom:8px;cursor:pointer;align-items:center;}
.rule-ver.on{border-color:var(--tint);background:rgba(90,169,255,.08);}
.rule-ver .vnum{width:34px;height:34px;border-radius:10px;background:rgba(90,169,255,.14);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--tint);flex-shrink:0;}
.rule-ver.on .vnum{background:var(--tint);color:#fff;}
.rule-ver .vt{flex:1;min-width:0;}
.rule-ver .vname{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rule-ver .vmeta{font-size:11px;color:var(--text-3);margin-top:2px;}
.doc{background:#101b2e;border:1px solid var(--line);border-radius:12px;padding:18px 16px;
  font-family:"Songti SC","SimSun",serif;font-size:13.5px;line-height:1.85;color:#d8e6f8;}
.doc h2{font-size:15px;text-align:center;font-weight:700;margin:0 0 6px;letter-spacing:1px;}
.doc .docno{text-align:center;font-size:11.5px;color:var(--text-3);margin-bottom:16px;
  font-family:ui-monospace,monospace;}
.doc .clause{margin-bottom:11px;display:flex;gap:8px;}
.doc .clause .cno{flex-shrink:0;color:var(--frost);font-weight:700;}
.doc .clause.missing{color:var(--red);opacity:.55;text-decoration:line-through;}
.doc .clause.strike{text-decoration:line-through;opacity:.5;}
.doc .clause .hand{font-family:cursive;color:var(--yellow);}
.doc .sign{text-align:right;margin-top:22px;font-size:12.5px;color:var(--text-2);line-height:1.9;}

/* forum */
.post-item{padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.post-item:active{background:rgba(90,169,255,.05);}
.post-title{font-size:14.5px;font-weight:600;line-height:1.4;margin-bottom:5px;}
.post-meta{font-size:11px;color:var(--text-3);display:flex;gap:10px;align-items:center;}
.post-author{color:var(--tint);}
.post-body{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;}
.post-comment{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6;}
.post-comment .pc-a{color:var(--tint);font-size:12px;font-weight:600;margin-bottom:3px;}

/* access */
.acc-row{display:flex;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line);align-items:center;
  font-size:13px;position:relative;}
.acc-time{font-family:ui-monospace,monospace;font-size:12px;color:var(--text-2);width:78px;flex-shrink:0;}
.acc-main{flex:1;min-width:0;}
.acc-name{font-size:13.5px;}
.acc-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.acc-res{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(52,199,89,.14);color:var(--green);}
.acc-res.bad{background:rgba(255,90,90,.14);color:var(--red);}
.acc-row.dup::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;
  background:repeating-linear-gradient(180deg,rgba(127,216,255,.5) 0 3px,transparent 3px 6px);}

/* weather */
.weather-hero{text-align:center;padding:26px 0 20px;}
.weather-temp{font-size:76px;font-weight:200;color:var(--ice);letter-spacing:-3px;line-height:1;
  text-shadow:0 0 40px rgba(127,216,255,.35);}
.weather-desc{font-size:14px;color:var(--text-2);margin-top:10px;letter-spacing:2px;}
.weather-warn{margin-top:18px;display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,154,60,.14);border:1px solid rgba(255,154,60,.35);color:var(--orange);
  padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;}
.hours{display:flex;gap:4px;overflow-x:auto;padding:14px 0;scrollbar-width:none;}
.hours::-webkit-scrollbar{display:none;}
.hour{flex-shrink:0;width:52px;text-align:center;padding:8px 0;border-radius:10px;
  background:rgba(22,35,58,.5);}
.hour .ht{font-size:11px;color:var(--text-3);}
.hour .hv{font-size:14px;color:var(--ice);margin-top:6px;font-weight:600;}

/* profile card */
.idcard{background:linear-gradient(150deg,#1d3a5e,#122340);border:1px solid var(--line-2);
  border-radius:18px;padding:20px;position:relative;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(207,230,255,.1);}
.idcard::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(127,216,255,.2),transparent 70%);}
.idc-school{font-size:12px;letter-spacing:3px;color:var(--frost);opacity:.85;}
.idc-name{font-size:24px;font-weight:600;margin-top:14px;letter-spacing:1px;}
.idc-row{display:flex;gap:22px;margin-top:12px;font-size:12px;color:var(--text-2);}
.idc-row span b{color:var(--text);font-weight:600;margin-left:4px;font-family:ui-monospace,monospace;}

/* toggle */
.tg{width:46px;height:28px;border-radius:14px;background:var(--card-2);position:relative;
  transition:background .2s var(--ease);flex-shrink:0;border:0;cursor:pointer;}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#8fa6c4;transition:all .2s var(--ease);}
.tg.on{background:var(--tint-2);}
.tg.on::after{left:21px;background:#fff;}

/* modal / toast */
#overlays{position:absolute;inset:0;z-index:80;pointer-events:none;}
.modal-mask{position:absolute;inset:0;background:rgba(4,8,16,.66);display:flex;
  align-items:center;justify-content:center;padding:28px;opacity:0;transition:opacity .2s;
  pointer-events:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.modal-mask.show{opacity:1;}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:22px;
  width:100%;max-width:330px;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:scale(.95);
  transition:transform .2s var(--ease);}

function deepMerge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (base && typeof base === "object" && over && typeof over === "object") {
    const out = {};
    Object.keys(base).forEach(k => { out[k] = over.hasOwnProperty(k) ? deepMerge(base[k], over[k]) : base[k]; });
    Object.keys(over).forEach(k => { if (!base.hasOwnProperty(k)) out[k] = over[k]; });
    return out;
  }
  return over === undefined ? base : over;
}
function migrate(d) {
  if (!d.settings) d.settings = clone(DEFAULT_DATA.settings);
  if (!d.story) d.story = clone(DEFAULT_DATA.story);
  if (!d.rules) d.rules = clone(DEFAULT_DATA.rules);
  if (!d.characters) d.characters = clone(DEFAULT_DATA.characters);
  if (!d.access) d.access = clone(DEFAULT_DATA.access);
  if (!d.forum) d.forum = clone(DEFAULT_DATA.forum);
  if (!d.chats) d.chats = clone(DEFAULT_DATA.chats);
  if (!d.notes) d.notes = clone(DEFAULT_DATA.notes);
  if (!d.notifications) d.notifications = clone(DEFAULT_DATA.notifications);
  if (!d.contacts) d.contacts = [];
  if (!d.archives) d.archives = [];
  if (!d.gallery) d.gallery = [];
  if (!d.clues) d.clues = { discovered:[], deduced:[] };
  if (!d.packs) d.packs = {};
  d.v = DATA_VERSION;
  return d;
}
function loadData() {
  const raw = localStorage.getItem(STORE_KEY);
  if (!raw) return clone(DEFAULT_DATA);
  try { return migrate(deepMerge(clone(DEFAULT_DATA), JSON.parse(raw))); }
  catch (e) { console.error(e); return clone(DEFAULT_DATA); }
}

/* ============ Router ============ */
const Router = {
  stack: [],
  push(key, render) {
    const el = document.createElement("div");
    el.className = "page";
    el.innerHTML = render();
    $("#pages-layer").appendChild(el);
    const prev = this.stack[this.stack.length - 1];
    if (prev) prev.el.classList.add("under");
    this.stack.push({ key, el, render });
    requestAnimationFrame(() => el.classList.add("in"));
    postRefresh();
  },
  pop() {
    const rec = this.stack.pop();
    if (!rec) return;
    rec.el.classList.remove("in");
    setTimeout(() => rec.el.remove(), 340);
    const prev = this.stack[this.stack.length - 1];
    if (prev) prev.el.classList.remove("under");
    postRefresh();
  },
  top() { return this.stack[this.stack.length - 1]; },
  refresh() {
    const rec = this.top();
    if (!rec) return;
    rec.el.innerHTML = rec.render();
    postRefresh();
  },
  home() { while (this.stack.length) { const r = this.stack.pop(); r.el.remove(); } }
};
function postRefresh() {
  const rec = Router.top();
  if (!rec) return;
  const body = rec.el.querySelector(".scroll-bottom");
  if (body) body.scrollTop = body.scrollHeight;
}

/* ============ ACTIONS ============ */
const ACTIONS = {};

ACTIONS.routerBack = () => { if (Router.stack.length) Router.pop(); else Router.home(); };
ACTIONS.closeModal = () => closeModal();

ACTIONS.openApp = (el) => {
  const id = el.dataset.app;
  const app = APPS[id];
  if (!app) return;
  vibrate(10);
  Router.push("app:" + id, app.render);
};
ACTIONS.gotoPage = (el) => gotoPage(+el.dataset.page);

ACTIONS.keypadPress = (el) => {
  const k = el.dataset.key;
  if (k === "del") {
    S.lockInput = S.lockInput.slice(0, -1);
    updateDots();
    return;
  }
  S.lockInput += k;
  updateDots();
  vibrate(8);
  if (S.lockInput.length === 4) {
    if (S.lockInput === D.settings.passcode) {
      setTimeout(() => { S.lockInput = ""; hideLock(); onUnlocked(); }, 180);
    } else {
      const kp = $(".keypad");
      if (kp) kp.classList.add("shake");
      vibrate(60);
      setTimeout(() => {
        if (kp) kp.classList.remove("shake");
        S.lockInput = "";
        updateDots();
      }, 420);
      toast("密码错误");
    }
  }
};

ACTIONS.openChat = (el) => {
  const chatId = el.dataset.chat;
  const chat = D.chats.find(c => c.id === chatId);
  if (chat) { chat.unread = 0; save(); }
  Router.push("chat:" + chatId, () => chatRoom(chatId));
  renderHome();
};
ACTIONS.openChatByChar = (el) => {
  const charId = el.dataset.char;
  const chat = D.chats.find(c => c.charId === charId);
  if (!chat) { toast("暂无会话"); return; }
  Router.push("chat:" + chat.id, () => chatRoom(chat.id));
};

ACTIONS.chatSend = (el) => {
  const chatId = el.dataset.chat;
  const input = $("#chat-input");
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const chat = D.chats.find(c => c.id === chatId);
  if (!chat) return;
  chat.msgs.push({ id: uid(), from: "me", text, ts: new Date(D.world.currentTime).toISOString() });
  input.value = "";
  save();
  Router.refresh();
  vibrate(10);
  if (chat.charId === "c_mom") {
    setTimeout(() => {
      chat.msgs.push({ id: uid(), from: "system", type: "error",
        text: "消息发送失败，请检查网络连接。", ts: new Date(D.world.currentTime).toISOString() });
      save(); Router.refresh();
    }, 700);
    return;
  }
  if (D.story.vars.__p1AutoReply === undefined) D.story.vars.__p1AutoReply = true;
  if (D.story.vars.__p1AutoReply) maybeAutoReply(chat);
};
const REPLY_POOL = {
  c_lin_shuang: ["我靠 真的假的","啊？？？","等一下我看看","……我有点慌","你别吓我啊","在在在","你还在吗","啊啊啊啊"],
  c_qian: ["md 我靠","行吧行吧","这不合理啊","我看看啊","喂 你还在吗","我这边也不对劲"]
};
function maybeAutoReply(chat) {
  const pool = REPLY_POOL[chat.charId];
  if (!pool) return;
  let text = pool[Math.floor(Math.random() * pool.length)];
  if (chat.charId === "c_qian" && !D.story.vars.__qianGarbleUsed && Math.random() < 0.2) {
    D.story.vars.__qianGarbleUsed = true;
    text = "jiiwpsusbejsjllqk";
  }
  setTimeout(() => {
    chat.msgs.push({ id: uid(), from: "them", text, ts: new Date(D.world.currentTime).toISOString() });
    save();
    if (Router.top() && Router.top().key === "chat:" + chat.id) Router.refresh();
    else { chat.unread = (chat.unread || 0) + 1; renderHome(); }
  }, 1400 + Math.random() * 800);
}

ACTIONS.selectRuleVer = (el) => {
  S.currentRuleVer = el.dataset.id;
  Router.refresh();
};

ACTIONS.openPost = (el) => {

ACTIONS.resetData = () => {
  confirmBox("恢复出厂设置", "所有进度、聊天记录、笔记将被清除，且无法恢复。", "确认恢复", () => {
    localStorage.removeItem(STORE_KEY);

      D.settings.devUnlocked = true;

/* ============ 解锁后 ============ */
function onUnlocked() {
  vibrate(20);
  if (!D.player.name) {
    promptName();
  }
}
function promptName() {
  modal(`<h3>这台手机是谁的？</h3>

    <input class="input" id="name-input" value="苏晚" maxlength="8">

      <button class="btn primary" data-action="confirmName">确定</button>
    </div>`);

ACTIONS.confirmName = () => {
  const v = $("#name-input").value.trim() || "苏晚";
  D.player.name = v;
  save(true);
  closeModal();
  toast("欢迎，" + v);
};

/* ============ 事件委托 ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  try { fn(el, e); } catch (err) { console.error(err); toast("操作失败"); }
}, true);

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.id === "chat-input") {
    const btn = $(".chat-send");
    if (btn) ACTIONS.chatSend(btn);
  }
});

/* ============ 适配 ============ */
function fitDevice() {
  const s = Math.min((window.innerWidth - 24) / 420, (window.innerHeight - 24) / 880, 1);
  $("#device").style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitDevice);

/* ============ 启动 ============ */
(function boot() {
  D = loadData();
  applySettings();
  fitDevice();
  renderStatusbar();
  renderHome();
  if (D.settings.skipLock) { hideLock(); onUnlocked(); }
  else showLock();
})();
</script>
