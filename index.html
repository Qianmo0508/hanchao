<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>寒潮预警</title>
<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--card-2:#f8f8fa;--nav-bg:rgba(255,255,255,.94);
  --line:#e2e2e8;--line-strong:#d1d1d8;
  --text:#1c1c1e;--text-2:#636366;--text-3:#8e8e93;
  --tint:#007aff;--tint-2:#0062cc;
  --green:#07c160;--red:#ff3b30;--orange:#ff9500;--yellow:#ffcc00;
  --me:#95ec69;--me-text:#000;
  --input-bg:#f7f7f8;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --fs-body:15px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--card-2:#2c2c2e;--nav-bg:rgba(28,28,30,.94);
  --line:#38383a;--line-strong:#48484a;
  --text:#ffffff;--text-2:#98989d;--text-3:#636366;
  --me:#2c6e1a;--me-text:#ffffff;
  --input-bg:#2c2c2e;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;
  font-family:var(--font);color:var(--text);user-select:none;-webkit-user-select:none;
  font-size:var(--fs-body);-webkit-font-smoothing:antialiased;}
#app{position:relative;width:100%;height:100vh;max-width:560px;margin:0 auto;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
#statusbar{flex:0 0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:14px;font-weight:600;color:var(--text);background:var(--nav-bg);
  font-variant-numeric:tabular-nums;z-index:30;backdrop-filter:blur(20px);}
#statusbar.transparent{background:transparent;color:#fff;}
#statusbar .sb-right{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:500;color:var(--text-2);}
#statusbar.transparent .sb-right{color:rgba(255,255,255,.8);}
#statusbar .sb-temp{color:var(--tint);font-weight:700;margin-right:6px;}
#statusbar.transparent .sb-temp{color:#7fd8ff;}
#screen{flex:1;position:relative;overflow:hidden;background:var(--bg);}

/* 开机 */
#boot{position:absolute;inset:0;background:#000;color:#fff;z-index:100;
  display:flex;flex-direction:column;padding:72px 28px 60px;overflow-y:auto;}
#boot .btxt{font-size:16px;line-height:2;color:#e8e8ed;white-space:pre-wrap;letter-spacing:.3px;}
#boot .bnext{position:absolute;bottom:40px;left:0;right:0;text-align:center;
  color:#8e8e93;font-size:13px;letter-spacing:2px;animation:breathe 2s ease-in-out infinite;cursor:pointer;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

/* 锁屏 */
#lock{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(160deg,#1a2236 0%,#0a1220 50%,#050810 100%);color:#fff;cursor:pointer;}
#lock::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 40% at 20% 15%,rgba(127,216,255,.12),transparent 70%),
  radial-gradient(50% 40% at 85% 80%,rgba(90,169,255,.08),transparent 70%);}
#lock .lk-time{font-size:72px;font-weight:200;letter-spacing:2px;margin-top:100px;
  text-shadow:0 0 40px rgba(90,169,255,.3);font-variant-numeric:tabular-nums;}
#lock .lk-date{font-size:15px;color:rgba(255,255,255,.6);margin-top:2px;letter-spacing:1px;}
#lock .lk-note{margin-top:52px;max-width:300px;text-align:center;line-height:2.2;
  font-size:16px;font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-style:italic;
  color:#cfe6ff;transform:rotate(-3deg);text-shadow:0 0 20px rgba(127,216,255,.4);}
#lock .lk-note .ln2{color:#7fd8ff;}
#lock .lk-hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;
  font-size:12px;color:rgba(255,255,255,.4);letter-spacing:3px;animation:breathe 2.4s ease-in-out infinite;}

/* 数字键盘 */
#pad{position:absolute;inset:0;z-index:22;background:rgba(10,18,32,.97);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;backdrop-filter:blur(20px);}
#pad .pwd-dots{display:flex;gap:18px;}
#pad .pwd-dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);transition:all .15s;}
#pad .pwd-dots span.on{background:#fff;border-color:#fff;}
#pad .keys{display:grid;grid-template-columns:repeat(3,72px);gap:16px;}
#pad .key{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.12);
  color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .1s,transform .1s;border:0;font-family:var(--font);}
#pad .key:active{background:rgba(255,255,255,.3);transform:scale(.94);}
#pad .key.del{font-size:18px;}
#pad .pad-hint{color:rgba(255,255,255,.4);font-size:12px;margin-top:8px;}

/* 主屏幕 */
#home{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;background:var(--bg);}
.home-top{padding:12px 20px 4px;display:flex;justify-content:space-between;align-items:flex-end;}
.home-top .ht-greet{font-size:22px;font-weight:700;}
.home-top .ht-sub{font-size:12px;color:var(--text-3);margin-top:2px;}
.home-top .ht-edit{font-size:13px;color:var(--tint);cursor:pointer;padding:6px 10px;border-radius:8px;transition:background .15s;}
.home-top .ht-edit:active{background:rgba(0,122,255,.1);}
.home-scroll{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
.home-scroll::-webkit-scrollbar{display:none;}
.home-page{flex:0 0 100%;scroll-snap-align:start;padding:16px 20px 60px;overflow-y:auto;}
.home-page .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;align-content:flex-start;}
.app-icon{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;
  gap:8px;cursor:pointer;position:relative;transition:transform .12s;}
.app-icon:active{transform:scale(.9);}
.app-icon .glyph{width:60px;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  position:relative;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.app-icon .glyph svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.app-icon .label{font-size:11px;color:var(--text);font-weight:500;text-align:center;line-height:1.2;
  max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.app-icon .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 6px;
  border-radius:10px;background:var(--red);color:#fff;font-size:11px;line-height:20px;text-align:center;
  font-weight:600;border:2px solid var(--bg);}
.app-icon.hint .glyph{animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.1),0 0 0 0 rgba(0,122,255,.4);}
  50%{box-shadow:0 2px 8px rgba(0,0,0,.1),0 0 0 8px rgba(0,122,255,.15);}}
.home-dots{flex:0 0 auto;display:flex;justify-content:center;gap:8px;padding:8px 0 16px;}
.page-dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:background .2s;}
.page-dot.on{background:var(--tint);}

/* 指引条 */
.guide-bar{position:absolute;bottom:20px;left:16px;right:16px;z-index:15;
  background:rgba(0,122,255,.96);color:#fff;border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,122,255,.35);
  animation:slideUp .35s cubic-bezier(.32,.72,0,1);}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.guide-bar .gb-text{flex:1;font-size:14px;line-height:1.4;}
.guide-bar .gb-btn{background:rgba(255,255,255,.22);border:0;color:#fff;padding:9px 16px;
  border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);
  transition:background .15s,transform .1s;white-space:nowrap;}
.guide-bar .gb-btn:active{background:rgba(255,255,255,.4);transform:scale(.94);}

/* 页面 */
#page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  z-index:5;animation:pageIn .24s cubic-bezier(.32,.72,0,1);}
@keyframes pageIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.navbar{flex:0 0 auto;height:52px;display:flex;align-items:center;background:var(--nav-bg);
  backdrop-filter:blur(20px);border-bottom:.5px solid var(--line);padding:0 8px;z-index:10;}
.navbar .nb-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tint);background:none;border:0;padding:0;border-radius:50%;
  transition:background .15s,transform .1s;}
.navbar .nb-back:active{background:rgba(0,122,255,.1);transform:scale(.94);}
.navbar .nb-back svg{width:22px;height:22px;fill:none;stroke:var(--tint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.navbar .nb-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
.navbar .nb-right{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--tint);font-size:20px;cursor:pointer;border-radius:50%;transition:background .15s;}
.navbar .nb-right:active{background:rgba(0,122,255,.1);}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{width:0;}
.content.pad{padding:16px;}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:10px;border:0;background:var(--tint);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);
  transition:transform .1s,opacity .1s,background .15s;}
.btn:active{transform:scale(.96);opacity:.85;}
.btn.secondary{background:var(--card-2);color:var(--text);border:1px solid var(--line-strong);}
.btn.danger{background:var(--red);}
.btn.block{display:flex;width:100%;margin-top:10px;}
.btn.small{padding:7px 14px;font-size:13px;}

/* 聊天 */
.msg-list{padding:8px 0 16px;}
.msg-row{display:flex;padding:4px 12px;gap:8px;align-items:flex-start;}
.msg-row.me{flex-direction:row-reverse;}
.msg-row .avatar{width:38px;height:38px;border-radius:6px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:15px;font-weight:600;overflow:hidden;}
.msg-row .msg-col{flex:0 1 auto;max-width:calc(100% - 70px);min-width:0;
  display:flex;flex-direction:column;gap:4px;}
.msg-row.me .msg-col{align-items:flex-end;}
.msg-row .msg-name{font-size:11px;color:var(--text-3);padding:0 4px;font-weight:500;}
.msg-row .bubble{background:var(--card);color:var(--text);padding:10px 13px;border-radius:10px;
  font-size:var(--fs-body);line-height:1.5;word-break:break-word;white-space:pre-wrap;
  position:relative;box-shadow:0 1px 1px rgba(0,0,0,.04);max-width:100%;}
.msg-row .bubble::before{content:"";position:absolute;left:-5px;top:12px;
  width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
  border-right:6px solid var(--card);}
.msg-row.me .bubble{background:var(--me);color:var(--me-text);}
.msg-row.me .bubble::before{left:auto;right:-5px;border-right:0;border-left:6px solid var(--me);}
.msg-row .bubble.notice{background:var(--card);border:1px solid var(--tint);color:var(--tint);
  cursor:pointer;font-size:14px;line-height:1.6;}
.msg-row .bubble.notice::before{border-right-color:var(--tint);}
.msg-time{font-size:11px;color:var(--text-3);text-align:center;padding:10px 0 4px;width:100%;display:block;}
.sys-msg{text-align:center;font-size:12px;color:var(--text-3);padding:6px 20px;line-height:1.5;}
.msg-form{flex:0 0 auto;background:var(--input-bg);border-top:.5px solid var(--line);
  padding:8px 10px 10px;display:flex;gap:8px;align-items:flex-end;}
.msg-form input{flex:1;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;
  padding:9px 12px;color:var(--text);font-size:15px;outline:none;font-family:var(--font);}
.msg-form input:disabled{background:var(--card-2);color:var(--text-3);}
.msg-form .send-btn{width:56px;height:36px;border-radius:8px;background:var(--green);border:0;
  color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);
  transition:transform .1s,opacity .1s;}
.msg-form .send-btn:active{transform:scale(.94);opacity:.85;}
.msg-form .send-btn:disabled{background:var(--line-strong);opacity:.6;cursor:not-allowed;}
.choices{flex:0 0 auto;background:var(--card);border-top:.5px solid var(--line);
  padding:12px 14px 16px;display:flex;flex-direction:column;gap:8px;}
.choice-btn{background:var(--card-2);border:1px solid var(--line-strong);color:var(--text);
  padding:13px 16px;border-radius:10px;font-size:15px;text-align:left;cursor:pointer;
  line-height:1.5;font-family:var(--font);transition:all .15s;}
.choice-btn:active{background:var(--tint);color:#fff;border-color:var(--tint);transform:scale(.98);}

/* 会话列表 */
.chat-item{display:flex;gap:12px;padding:12px 16px;align-items:center;
  border-bottom:.5px solid var(--line);cursor:pointer;background:var(--card);transition:background .1s;}
.chat-item:active{background:var(--card-2);}
.chat-item .av{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:18px;font-weight:600;flex:0 0 auto;overflow:hidden;}
.chat-item .ci-body{flex:1;min-width:0;}
.chat-item .ci-name{font-size:16px;font-weight:500;display:flex;justify-content:space-between;
  align-items:center;gap:8px;color:var(--text);}
.chat-item .ci-name span.t{font-size:12px;color:var(--text-3);font-weight:400;flex:0 0 auto;}
.chat-item .ci-prev{font-size:13px;color:var(--text-3);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-item .badge2{background:var(--red);color:#fff;font-size:11px;border-radius:10px;
  padding:1px 7px;margin-left:6px;font-weight:600;}

/* 论坛 */
.board-tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);
  border-bottom:.5px solid var(--line);flex:0 0 auto;}
.board-tabs::-webkit-scrollbar{display:none;}
.board-tab{flex:0 0 auto;padding:7px 14px;border-radius:16px;background:var(--card-2);
  border:0;font-size:13px;color:var(--text-2);cursor:pointer;font-family:var(--font);
  transition:all .12s;font-weight:500;}
.board-tab:active{transform:scale(.94);}
.board-tab.on{background:var(--tint);color:#fff;}
.post-item{padding:14px 16px;border-bottom:.5px solid var(--line);cursor:pointer;background:var(--card);transition:background .1s;}
.post-item:active{background:var(--card-2);}
.post-item .pi-title{font-size:16px;font-weight:500;line-height:1.4;color:var(--text);}
.post-item .pi-meta{font-size:12px;color:var(--text-3);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;}
.post-item .pi-hot{color:var(--orange);font-weight:600;}
.post-detail{background:var(--card);padding:16px;}
.post-detail .pd-title{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:10px;}
.post-detail .pd-meta{font-size:12px;color:var(--text-3);margin-bottom:16px;padding-bottom:16px;
  border-bottom:.5px solid var(--line);}
.post-detail .pd-body{font-size:15px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
.comment{padding:14px 16px;border-bottom:.5px solid var(--line);background:var(--card);font-size:14px;line-height:1.65;}
.comment .cm-from{color:var(--tint);font-size:12px;margin-bottom:5px;font-weight:500;}
.comment .cm-reply{color:var(--text-2);font-size:13px;}
.post-locked{margin:16px;padding:14px;background:rgba(255,59,48,.06);
  border:1px solid rgba(255,59,48,.2);border-radius:10px;text-align:center;
  color:var(--red);font-size:13px;font-weight:500;}

/* 规则 */
.rule-card{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow);}
.rule-card .rc-num{color:var(--tint);font-weight:700;margin-right:6px;font-size:15px;}
.rule-card p{margin:0;font-size:var(--fs-body);line-height:1.85;color:var(--text);
  padding-left:24px;text-indent:-24px;}
.rule-card.danger{background:rgba(255,59,48,.05);border:1px solid rgba(255,59,48,.2);}
.rule-card.danger .rc-num{color:var(--red);}
.rule-card.danger p{color:#c00;}
[data-theme="dark"] .rule-card.danger p{color:#ff8a80;}
.rule-meta{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:14px;
  font-size:13px;color:var(--text-2);line-height:1.9;box-shadow:var(--shadow);}
.rule-meta b{color:var(--text);font-weight:600;}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.section-title{font-size:12px;color:var(--text-3);margin:20px 4px 10px;letter-spacing:1px;font-weight:500;text-transform:uppercase;}
.section-title:first-child{margin-top:0;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;color:var(--text-3);font-size:14px;text-align:center;line-height:1.8;}

/* 学生卡 */
.id-card{background:linear-gradient(160deg,#1d3a66,#0f1f3a);color:#fff;border-radius:16px;
  padding:20px;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(29,58,102,.25);}
.id-card::after{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;
  border-radius:50%;background:radial-gradient(circle,rgba(127,216,255,.15),transparent 70%);}
.id-card .id-name{font-size:22px;font-weight:700;letter-spacing:1px;}
.id-card .id-line{font-size:13px;color:rgba(255,255,255,.75);margin-top:8px;line-height:1.6;}
.id-card .id-no{font-family:"SF Mono",Menlo,monospace;font-size:13px;color:#7fd8ff;margin-top:16px;letter-spacing:1px;}

/* 菜单 */
.menu-list{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.menu-item{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:.5px solid var(--line);
  cursor:pointer;font-size:15px;color:var(--text);transition:background .1s;}
.menu-item:last-child{border-bottom:0;}
.menu-item:active{background:var(--card-2);}
.menu-item .mi-ic{width:32px;height:32px;border-radius:8px;background:rgba(0,122,255,.12);
  display:flex;align-items:center;justify-content:center;color:var(--tint);font-size:14px;font-weight:700;flex:0 0 auto;}
.menu-item .mi-arrow{margin-left:auto;color:var(--text-3);font-size:18px;line-height:1;}

/* 设置 */
.setting-group{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;}
.setting-row{display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:.5px solid var(--line);font-size:15px;gap:12px;min-height:52px;}
.setting-row:last-child{border-bottom:0;}
.setting-row .sr-label{color:var(--text);flex:0 0 auto;}
.setting-row .sr-val{color:var(--text-3);font-size:14px;text-align:right;flex:1;
  display:flex;justify-content:flex-end;align-items:center;gap:8px;}
.setting-row .sr-val select{background:transparent;border:0;color:var(--tint);font-size:14px;
  font-family:var(--font);cursor:pointer;outline:none;font-weight:500;appearance:none;-webkit-appearance:none;
  text-align:right;direction:rtl;}
[data-theme="dark"] .setting-row .sr-val select{color:var(--tint);}
.setting-row .sr-val select option{background:var(--card);color:var(--text);direction:ltr;}
.setting-row .switch{width:50px;height:30px;border-radius:15px;background:var(--line-strong);
  position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto;border:0;}
.setting-row .switch.on{background:var(--green);}
.setting-row .switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;
  border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.setting-row .switch.on::after{transform:translateX(20px);}
.setting-row .switch:active{transform:scale(.96);}

/* 课表 */
.schedule-day{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.schedule-day .sd-title{font-size:14px;color:var(--tint);font-weight:600;margin-bottom:10px;}
.schedule-day .sd-courses{display:flex;flex-wrap:wrap;gap:8px;}
.schedule-day .sd-course{font-size:13px;background:var(--card-2);border-radius:6px;padding:6px 12px;color:var(--text-2);}

/* 健康 */
.health-card{background:var(--card);border-radius:14px;padding:24px;text-align:center;margin-bottom:14px;box-shadow:var(--shadow);}
.health-card .hc-temp{font-size:48px;font-weight:200;color:var(--tint);font-variant-numeric:tabular-nums;line-height:1;}
.health-card .hc-label{font-size:13px;color:var(--text-3);margin-top:8px;}

/* 天气 */
.temp-big{font-size:72px;font-weight:100;color:var(--tint);text-align:center;line-height:1;letter-spacing:-3px;margin:16px 0 8px;}
.temp-desc{text-align:center;font-size:14px;color:var(--text-2);margin-bottom:20px;}
.warn-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,
  #3aa0ff 0%,#3aa0ff 25%,#ffd24a 25%,#ffd24a 50%,#ff9a3c 50%,#ff9a3c 75%,#ff5a5a 75%,#ff5a5a 100%);
  margin-bottom:8px;position:relative;}
.warn-bar .wb-dot{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.25);transition:left .3s;border:2px solid var(--tint);}
.warn-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-bottom:20px;}
.hourly{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.hourly::-webkit-scrollbar{display:none;}
.hour-cell{flex:0 0 auto;text-align:center;background:var(--card);border-radius:10px;padding:10px 14px;min-width:60px;box-shadow:var(--shadow);}
.hour-cell .hc-t{font-size:11px;color:var(--text-3);}
.hour-cell .hc-v{font-size:15px;color:var(--tint);margin-top:6px;font-weight:600;}

/* 门禁 */
.log-item{display:flex;gap:12px;padding:14px 16px;background:var(--card);border-bottom:.5px solid var(--line);align-items:center;font-size:14px;}
.log-item .li-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto;font-size:13px;font-weight:700;}
.log-item .li-icon.ok{background:rgba(7,193,96,.15);color:var(--green);}
.log-item .li-icon.deny{background:rgba(255,59,48,.12);color:var(--red);}
.log-item .li-icon.unk{background:rgba(255,149,0,.15);color:var(--orange);}
.log-item .li-body{flex:1;min-width:0;}
.log-item .li-name{color:var(--text);font-size:15px;}
.log-item .li-meta{font-size:12px;color:var(--text-3);margin-top:3px;}
.log-item .li-time{font-size:12px;color:var(--text-3);font-family:"SF Mono",Menlo,monospace;}

/* 通讯录 */
.contact-item{display:flex;gap:12px;padding:12px 16px;align-items:center;border-bottom:.5px solid var(--line);cursor:pointer;background:var(--card);transition:background .1s;}
.contact-item:active{background:var(--card-2);}
.contact-item .ct-av{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:16px;font-weight:600;flex:0 0 auto;}
.contact-item .ct-body{flex:1;min-width:0;}
.contact-item .ct-name{font-size:15px;color:var(--text);}
.contact-item .ct-note{font-size:12px;color:var(--text-3);margin-top:3px;}
.contact-item .ct-online{font-size:11px;padding:3px 8px;border-radius:8px;flex:0 0 auto;font-weight:500;}
.contact-item .ct-online.on{color:var(--green);background:rgba(7,193,96,.1);}
.contact-item .ct-online.off{color:var(--text-3);background:var(--card-2);}

/* 备忘录 */
.note-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.note-card .nc-time{font-size:12px;color:var(--text-3);margin-bottom:10px;font-family:"SF Mono",Menlo,monospace;}
.note-card .nc-body{font-size:var(--fs-body);line-height:1.9;white-space:pre-wrap;color:var(--text);}
.caret{display:inline-block;width:2px;height:16px;background:var(--tint);vertical-align:-3px;
  animation:blink 1s steps(2) infinite;margin-left:1px;}
@keyframes blink{50%{opacity:0}}

/* 计算器 */
.calc{display:flex;flex-direction:column;height:100%;background:var(--bg);}
.calc .calc-display{flex:0 0 auto;padding:20px 24px;text-align:right;font-size:44px;font-weight:200;
  color:var(--text);min-height:90px;word-break:break-all;overflow:hidden;font-variant-numeric:tabular-nums;}
.calc .calc-pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  padding:1px;padding-bottom:20px;}
.calc .calc-pad button{border:0;background:var(--card);color:var(--text);font-size:22px;
  cursor:pointer;font-family:var(--font);transition:background .1s,transform .05s;}
.calc .calc-pad button:active{background:var(--card-2);transform:scale(.97);}
.calc .calc-pad button.op{background:var(--tint);color:#fff;}
.calc .calc-pad button.op:active{background:var(--tint-2);}
.calc .calc-pad button.eq{background:var(--green);color:#fff;}
.calc .calc-pad button.fn{background:var(--card-2);color:var(--text);}

/* 相册 */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;}
.gallery-item{aspect-ratio:1;background:var(--card-2);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .1s;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);
  font-size:12px;text-align:center;padding:8px;}
.gallery-item:active{transform:scale(.96);}

/* 时钟 */
.clock-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px 20px;}
.clock-face{font-size:64px;font-weight:200;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:2px;}
.clock-date{font-size:16px;color:var(--text-2);margin-top:12px;}
.clock-tz{font-size:12px;color:var(--text-3);margin-top:8px;}

/* 弹窗 */
#overlays{position:absolute;inset:0;z-index:80;pointer-events:none;}
#overlays.on{pointer-events:auto;}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);
  background:var(--card);border-radius:16px;overflow:hidden;max-height:80%;box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:modalIn .25s cubic-bezier(.32,.72,0,1);}
@keyframes modalIn{from{transform:translateY(-50%) scale(.94);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
.modal .m-head{padding:20px 20px 8px;text-align:center;}
.modal .m-head h3{margin:0;font-size:17px;font-weight:600;}
.modal .m-body{padding:0 20px 20px;font-size:14px;line-height:1.7;color:var(--text-2);white-space:pre-wrap;text-align:center;}
.modal .m-actions{display:flex;border-top:.5px solid var(--line);}
.modal .m-actions button{flex:1;padding:14px;background:none;border:0;font-size:16px;color:var(--tint);
  cursor:pointer;font-family:var(--font);transition:background .12s;}
.modal .m-actions button:active{background:var(--card-2);}
.modal .m-actions button+button{border-left:.5px solid var(--line);}
.modal .m-actions button.danger{color:var(--red);}
.modal .m-actions button.primary{font-weight:600;}

/* 通知 */
.notice-pop{position:absolute;top:56px;left:12px;right:12px;background:rgba(255,255,255,.98);
  border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.15);
  animation:dropIn .35s cubic-bezier(.32,.72,0,1);cursor:pointer;z-index:81;pointer-events:auto;
  backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,.05);}
[data-theme="dark"] .notice-pop{background:rgba(44,44,46,.98);border-color:rgba(255,255,255,.08);}
@keyframes dropIn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.notice-pop .np-app{font-size:12px;color:var(--tint);font-weight:600;letter-spacing:.5px;}
.notice-pop .np-title{font-size:15px;font-weight:600;margin-top:6px;color:var(--text);}
.notice-pop .np-body{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.5;}

/* Toast */
#toasts{position:absolute;left:0;right:0;bottom:120px;z-index:120;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none;}
.toast{background:rgba(0,0,0,.8);border-radius:20px;padding:10px 20px;font-size:14px;color:#fff;
  animation:dropIn .25s cubic-bezier(.32,.72,0,1);max-width:80%;text-align:center;backdrop-filter:blur(20px);}

/* 开发者 */
.dev-panel{padding:16px;background:var(--bg);}
.dev-panel textarea{width:100%;height:200px;background:var(--card);border:1px solid var(--line-strong);
  border-radius:10px;padding:12px;color:var(--text);font-family:"SF Mono",Menlo,monospace;
  font-size:12px;line-height:1.5;resize:vertical;outline:none;}
.dev-panel .dev-title{font-size:12px;color:var(--text-3);margin:16px 4px 8px;letter-spacing:1px;font-weight:500;}
.dev-panel .dev-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.dev-panel .dev-row .btn{flex:1;min-width:100px;}
.dev-panel .dev-info{background:var(--card);border-radius:10px;padding:12px;font-size:12px;
  font-family:"SF Mono",Menlo,monospace;line-height:1.7;color:var(--text-2);white-space:pre-wrap;word-break:break-all;}

[data-reduce-motion="1"] *{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
@media (max-width:560px){#app{max-width:none;}}

/* ============ 存档 ============ */
let saveTimer=null;
function deepMerge(b,o){
  if(Array.isArray(b))return Array.isArray(o)?o:b;
  if(b&&typeof b==="object"&&o&&typeof o==="object"){
    const r={};
    Object.keys(b).forEach(k=>{r[k]=o.hasOwnProperty(k)?deepMerge(b[k],o[k]):b[k];});
    Object.keys(o).forEach(k=>{if(!b.hasOwnProperty(k))r[k]=o[k];});
    return r;
  }
  return o===undefined?b:o;
}
function migrate(d){
  const def=defaultData();
  ["settings","player","world","story","rules","weather","studentCard"].forEach(k=>{
    if(!d[k])d[k]=clone(def[k]);
  });
  if(!d.story.vars)d.story.vars=clone(def.story.vars);
  if(!d.packs)d.packs={};
  d.v=DATA_VERSION;
  return d;
}
function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw){const d=buildSeed(defaultData());saveData(d);return d;}
    return migrate(deepMerge(defaultData(),JSON.parse(raw)));
  }catch(e){console.error(e);return buildSeed(defaultData());}
}
function saveData(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d||D));}catch(e){console.error(e);}}
function save(im){clearTimeout(saveTimer);if(im){saveData(D);return;}saveTimer=setTimeout(()=>saveData(D),200);}
function getSlots(){try{return JSON.parse(localStorage.getItem(SLOT_KEY))||[null,null,null];}catch(e){return[null,null,null];}}
function setSlots(s){localStorage.setItem(SLOT_KEY,JSON.stringify(s));}

function applyTheme(){
  let theme=D.settings.theme;
  if(theme==="auto"){
    theme=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }
  document.documentElement.dataset.theme=theme;
  document.documentElement.dataset.reduceMotion=D.settings.reduceMotion?"1":"0";
  const fsMap={small:"13px",medium:"15px",large:"17px"};
  document.documentElement.style.setProperty("--fs-body",fsMap[D.settings.fontSize]||"15px");
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=theme==="dark"?"#000000":"#ffffff";
}

/* ============ 主渲染 ============ */
function render(){
  applyTheme();
  renderStatusbar();
  const screen=$("#screen");
  if(!S.booted){screen.innerHTML=renderBoot();restartBootTyping();return;}
  if(S.locked){screen.innerHTML=S.padOpen?renderPad():renderLock();return;}
  if(S.stack.length>0){
    screen.innerHTML=renderPage(topKey());
    requestAnimationFrame(()=>{
      const el=$(".content[data-autoscroll]");
      if(el)el.scrollTop=el.scrollHeight;
    });
  }else{
    screen.innerHTML=renderHome();
    bindHomeScroll();
  }
}

/* ============ 计算器 ============ */
function renderCalc(){
  const d=S.calc.display;
  const btns=[
    ["AC","fn"],["±","fn"],["%","fn"],["÷","op"],
    ["7",""],["8",""],["9",""],["×","op"],
    ["4",""],["5",""],["6",""],["−","op"],
    ["1",""],["2",""],["3",""],["+","op"],
    ["0",""],["00",""],["."],["=","eq"]
  ];
  return `<div id="page">${nav("计算器")}
    <div class="calc">
      <div class="calc-display">${esc(d)}</div>
      <div class="calc-pad">
        ${btns.map(([label,cls])=>`<button class="${cls||""}" data-action="calcKey" data-k="${label}">${label}</button>`).join("")}
      </div>
    </div>
  </div>`;
}
function calcKey(k){
  const c=S.calc;
  if(k==="AC"){c.display="0";c.prev=null;c.op=null;c.waiting=false;}
  else if(k==="±"){c.display=c.display.startsWith("-")?c.display.slice(1):"-"+c.display;}
  else if(k==="%"){
    const v=parseFloat(c.display)||0;c.display=String(v/100);
  }
  else if(["÷","×","−","+"].includes(k)){
    c.prev=parseFloat(c.display)||0;c.op=k;c.waiting=true;
  }
  else if(k==="="){
    if(c.op&&c.prev!==null){
      const a=c.prev,b=parseFloat(c.display)||0;
      let r=0;
      if(c.op==="+")r=a+b;else if(c.op==="−")r=a-b;
      else if(c.op==="×")r=a*b;else if(c.op==="÷")r=b===0?0:a/b;
      c.display=String(Math.round(r*1e10)/1e10);
      c.prev=null;c.op=null;c.waiting=false;
    }
  }
  else{
    if(c.waiting){c.display=k==="."?"0.":k;c.waiting=false;}
    else{
      if(k==="."&&c.display.includes("."))return;
      c.display=c.display==="0"&&k!=="."?k:c.display+k;
    }
  }
  save();render();
}

/* ============ 通知 ============ */
function pushNotice(app,title,body,onClick){
  S.noticeQueue.push({app,title,body,onClick});
  showNextNotice();
}
function showNextNotice(){
  if(S.noticeShowing||S.noticeQueue.length===0)return;
  S.noticeShowing=true;
  const n=S.noticeQueue.shift();
  const el=document.createElement("div");
  el.className="notice-pop";
  el.innerHTML=`<div class="np-app">${esc(n.app)}</div>
    <div class="np-title">${esc(n.title)}</div>
    <div class="np-body">${esc(n.body)}</div>`;
  el.onclick=()=>{
    el.remove();S.noticeShowing=false;
    if(n.onClick)n.onClick();
    setTimeout(showNextNotice,240);
  };
  $("#overlays").appendChild(el);
  $("#overlays").classList.add("on");
  setTimeout(()=>{
    if(el.parentNode){el.remove();S.noticeShowing=false;showNextNotice();}
  },7000);
}

const ACTIONS={};

ACTIONS.openPad=function(){S.padOpen=true;render();};
ACTIONS.padKey=function(el){padKey(el.dataset.k);};

ACTIONS.openApp=function(el){openApp(el.dataset.app);};
function openApp(id){
  if(id==="notes"){
    pushPage("notes");
    if(D.story.step==="toNotes"&&!D.story.vars.notesRead){
      setTimeout(startNoteTyping,50);
    }
    return;
  }
  if(id==="chat"){
    pushPage("chat");
    if(D.story.step==="toChat"){D.story.step="chatRead";save();}
    return;
  }
  if(id==="forum"){pushPage("forum");return;}
  if(id==="rules"){
    pushPage("rules");
    if(D.story.step==="toRules"){D.story.vars.newRulesBadge=false;save();}
    setTimeout(triggerAfterRulesRead,200);
    return;
  }
  if(id==="school"){pushPage("school");return;}
  if(id==="weather"){pushPage("weather");return;}
  if(id==="access"){pushPage("access");return;}
  if(id==="contacts"){pushPage("contacts");return;}
  if(id==="xiaoqu"){pushPage("xiaoqu");return;}
  if(id==="calc"){pushPage("calc");return;}
  if(id==="gallery"){pushPage("gallery");return;}
  if(id==="clock"){pushPage("clock");return;}
  if(id==="settings"){pushPage("settings");return;}
}

ACTIONS.guideGo=function(el){openApp(el.dataset.app);};
ACTIONS.goHome=function(){goHome();};
ACTIONS.popPage=function(){popPage();};
ACTIONS.openSettings=function(){pushPage("settings");};

ACTIONS.openChat=function(el){
  const id=el.dataset.id;
  S.currentChatId=id;
  const c=D.chats.find(x=>x.id===id);
  if(c&&c.unread)c.unread=0;
  pushPage("chat:"+id);
  save();
  if(id==="c_north"&&D.story.step==="chatRead"&&!D.story.vars.groupChoice1){
    setTimeout(triggerGroupChoice1,200);
  }
  if(id==="c_north"&&D.story.step==="groupDayi"&&!D.story.pending){
    setTimeout(triggerGroupDayi,200);
  }
  if(id==="c_north"&&D.story.step==="backToGroup"&&!D.story.pending){
    setTimeout(triggerGroupDayi,200);
  }
  if(id==="c_north"&&D.story.step==="ch1End"&&!D.story.vars.groupChoice2){
    setTimeout(triggerAfterRulesRead,200);
  }
};

ACTIONS.openRules=function(){goHome();pushPage("rules");setTimeout(triggerAfterRulesRead,200);};
ACTIONS.openExistingChat=function(el){
  const id=el.dataset.id;
  pushPage("chat");
  pushPage("chat:"+id);
};

ACTIONS.chooseStory=function(el){
  const i=parseInt(el.dataset.i,10);
  const pending=D.story.pending;
  if(!pending||!pending.choices[i]||!pending.choices[i].fn)return;
  const fn=pending.choices[i].fn;
  pending.choices[i].fn=null;
  fn();
  render();
};

ACTIONS.forumTab=function(el){S.currentBoard=el.dataset.b;render();};
ACTIONS.openPost=function(el){
  pushPage("forum:"+el.dataset.id);
  if(el.dataset.id==="p_wxg")setTimeout(triggerForumRead,300);

  save();render();toast("打卡成功");
};
ACTIONS.openContact=function(el){pushPage("contacts:"+el.dataset.id);};
ACTIONS.toastOnly=function(el){toast(el.dataset.msg||"暂不可用");};
ACTIONS.openGallery=function(el){pushPage("gallery:"+el.dataset.id);};

ACTIONS.calcKey=function(el){calcKey(el.dataset.k);};

/* 设置动作 */

};

};
ACTIONS.setMsgSpeed=function(el){

};

ACTIONS.toggleSound=function(){

};
ACTIONS.toggleVibrate=function(){

};
ACTIONS.changePasscode=function(){

    <div class="m-body">当前密码：${esc(D.settings.passcode)}</div>
    <div class="m-actions"><button onclick="closeModal()">关闭</button></div>`);
};
ACTIONS.saveSlot=function(el){
  const slot=parseInt(el.dataset.slot,10);
  const slots=getSlots();
  if(slots[slot]){
    confirmBox("覆盖存档","存档位 "+(slot+1)+" 已有数据，要覆盖吗？",()=>{
      slots[slot]={data:JSON.stringify(D),time:new Date().toLocaleString()};
      setSlots(slots);toast("已保存到存档位 "+(slot+1));
      render();
    });
  }else{
    slots[slot]={data:JSON.stringify(D),time:new Date().toLocaleString()};
    setSlots(slots);toast("已保存到存档位 "+(slot+1));
    render();
  }
};
ACTIONS.exportSave=function(){
  const blob=new Blob([JSON.stringify(D)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="hanchao-save-"+Date.now()+".json";
  a.click();toast("存档已导出");
};
ACTIONS.importSave=function(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json";
  input.onchange=e=>{
    const f=e.target.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        D=migrate(deepMerge(defaultData(),d));
        save(true);render();toast("存档已导入");
      }catch(err){toast("导入失败");}
    };
    r.readAsText(f);
  };
  input.click();
};
ACTIONS.resetGame=function(){
  confirmBox("重置游戏","将清除所有本地存档，从头开始。确定吗？",()=>{
    localStorage.removeItem(STORE_KEY);
    D=buildSeed(defaultData());
    saveData(D);
    S.booted=false;S.locked=true;S.padBuf="";S.padOpen=false;
    S.stack=[];S.bootReady=false;
    render();
  });
};

/* ============ 弹窗 ============ */
function toast(msg,ms){
  const el=document.createElement("div");
  el.className="toast";el.textContent=msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>{el.remove();},ms||1800);
}
function modal(html){
  const ov=$("#overlays");
  ov.classList.add("on");
  ov.innerHTML=`<div class="modal-bg" onclick="closeModal()"></div><div class="modal">${html}</div>`;
}
function closeModal(){
  const ov=$("#overlays");
  ov.classList.remove("on");ov.innerHTML="";
  S.noticeShowing=false;setTimeout(showNextNotice,200);
}
window.closeModal=closeModal;
function confirmBox(title,text,cb){
  modal(`<div class="m-head"><h3>${esc(title)}</h3></div>
    <div class="m-body">${esc(text)}</div>
    <div class="m-actions">
      <button onclick="closeModal()">取消</button>
      <button class="danger" id="confirm-yes">确定</button>
    </div>`);
  $("#confirm-yes").onclick=()=>{closeModal();cb();};
}
window.confirmBox=confirmBox;

/* ============ 时钟实时刷新 ============ */
setInterval(()=>{
  const el=$("#clock-face");
  if(el){
    const now=new Date();
    el.textContent=String(now.getHours()).padStart(2,"0")+":"+
      String(now.getMinutes()).padStart(2,"0")+":"+
      String(now.getSeconds()).padStart(2,"0");
  }
},1000);

/* ============ 事件委托 ============ */
document.addEventListener("click",e=>{
  if(!S.booted&&S.bootReady&&e.target.closest("#boot")){
    S.booted=true;S.locked=true;S.padOpen=false;
    D.story.step="lock";save(true);S.bootReady=false;render();return;
  }
  if(S.locked&&!S.padOpen&&e.target.closest("#lock")){
    S.padOpen=true;render();return;
  }
  const el=e.target.closest("[data-action]");
  if(!el)return;
  const fn=ACTIONS[el.dataset.action];
  if(!fn)return;
  e.preventDefault();
  try{fn(el,e);}catch(err){console.error(err);toast("操作失败");}
},true);

/* select 的 change 事件 */
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-action]");
  if(!el)return;
  if(el.tagName==="SELECT"){
    const fn=ACTIONS[el.dataset.action];
    if(fn){try{fn(el,e);}catch(err){console.error(err);}}
  }
},true);

window.addEventListener("beforeunload",()=>save(true));

/* ============ 启动 ============ */
function boot(){
  applyTheme();
  if(D.story.step&&!["boot","lock"].includes(D.story.step)&&D.story.step!==null){
    S.booted=true;S.locked=false;
    render();
    if(D.story.step==="toNotes"&&!D.story.vars.notesRead){
      setTimeout(startNoteTyping,300);
    }
    return;
  }
  render();
}

boot();
</script>
