<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>寒潮预警</title>
<style>
:root{
  --bg:#0a1220;--bg-2:#0f1a2e;--card:#16233a;--card-2:#1d2f4a;
  --line:rgba(120,170,230,.14);--text:#e8f1ff;--text-2:#8fa6c4;--text-3:#5c7089;
  --tint:#5aa9ff;--tint-2:#3b82f6;--ice:#7fd8ff;--frost:#cfe6ff;
  --glow:0 0 24px rgba(90,169,255,.35);
  --blue-warn:#3aa0ff;--yellow:#ffd24a;--orange:#ff9a3c;--red:#ff5a5a;--green:#34c759;
  --r:16px;--r-s:10px;--ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#02040a;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);user-select:none;-webkit-user-select:none;}
body{display:flex;align-items:center;justify-content:center;}
#phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 10px #0d1522,0 0 0 12px #1a2638,0 30px 80px rgba(0,0,0,.9),0 0 60px rgba(90,169,255,.08);
  transform-origin:center center;}
#phone::after{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:112px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:200;pointer-events:none;}
#screen{position:absolute;inset:0;overflow:hidden;}
#wallpaper{position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#0a1220 55%,#05080f 100%),
  radial-gradient(60% 40% at 80% 100%,rgba(90,169,255,.10),transparent 60%);}
#wallpaper::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 20% 30%,rgba(207,230,255,.05) 0 1px,transparent 2px),
  radial-gradient(circle at 70% 60%,rgba(207,230,255,.04) 0 1px,transparent 2px),
  radial-gradient(circle at 45% 85%,rgba(207,230,255,.05) 0 1px,transparent 2px);
  background-size:90px 90px,70px 70px,110px 110px;opacity:.8;}
#statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  font-size:13px;color:var(--text);pointer-events:none;font-variant-numeric:tabular-nums;}
#statusbar .sb-temp{color:var(--ice);font-weight:600;animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.9}50%{opacity:.55}}
#statusbar .sb-right{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text-2);}
#stage{position:absolute;inset:0;z-index:5;overflow:hidden;}
#boot{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:80px 32px 100px;background:#000;z-index:10;}
#boot .btxt{font-size:16px;line-height:2;color:#dfe9f5;white-space:pre-wrap;letter-spacing:.5px;}
#boot .bcaret{display:inline-block;width:8px;height:17px;background:#dfe9f5;vertical-align:-2px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0}}
#boot .bnext{position:absolute;bottom:56px;left:0;right:0;text-align:center;color:var(--text-3);
  font-size:12px;letter-spacing:3px;animation:breathe 2.4s ease-in-out infinite;}
#lock{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,rgba(10,18,32,.3),rgba(5,8,15,.85));}
#lock .lk-time{font-size:76px;font-weight:200;letter-spacing:2px;margin-top:120px;
  text-shadow:0 0 40px rgba(90,169,255,.35);font-variant-numeric:tabular-nums;}
#lock .lk-date{font-size:14px;color:var(--text-2);letter-spacing:2px;margin-top:4px;}
#lock .lk-note{margin-top:52px;max-width:290px;text-align:center;line-height:2.1;font-size:15px;
  font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-style:italic;color:#cfe6ff;
  transform:rotate(-3deg);text-shadow:0 0 20px rgba(127,216,255,.4);}
#lock .lk-note div:nth-child(2){color:var(--ice);}
#lock .lk-hint{margin-top:auto;margin-bottom:56px;font-size:12px;color:var(--text-3);letter-spacing:4px;
  animation:breathe 2.4s ease-in-out infinite;}
#pad{position:absolute;inset:0;z-index:22;background:rgba(5,8,15,.97);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;}
#pad .dots{display:flex;gap:20px;margin-bottom:30px;}
#pad .dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--tint);opacity:.4;transition:all .15s;}
#pad .dots span.on{background:var(--tint);opacity:1;box-shadow:var(--glow);}
#pad .keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
#pad .key{width:72px;height:72px;border-radius:50%;background:rgba(29,47,74,.7);border:1px solid var(--line);
  color:var(--text);font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s var(--ease);}
#pad .key:active{background:var(--tint);color:#05080f;}
#pad .key.wide{font-size:16px;}
#home{position:absolute;inset:0;padding:60px 20px 40px;z-index:1;display:flex;flex-direction:column;}
#home .hm-title{margin-bottom:20px;color:var(--text-2);font-size:11px;letter-spacing:4px;text-align:center;}
#home .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;}
.app-icon{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;position:relative;}
.app-icon .glyph{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  position:relative;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);}
.app-icon .glyph svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.app-icon .label{font-size:11px;color:var(--text);opacity:.9;letter-spacing:.5px;}
.app-icon .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10px;line-height:18px;text-align:center;font-weight:600;}
.app-icon.hint .glyph{box-shadow:0 0 0 3px var(--tint),var(--glow);animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(90,169,255,.15),var(--glow);}}
#page{position:absolute;inset:0;z-index:5;background:var(--bg-2);display:flex;flex-direction:column;
  animation:slideIn .26s var(--ease);}
@keyframes slideIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.navbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--line);background:rgba(15,26,46,.7);backdrop-filter:blur(8px);}
.navbar .nb-back{width:40px;height:32px;display:flex;align-items:center;justify-content:flex-start;cursor:pointer;
  color:var(--tint);background:none;border:0;padding:0;}
.navbar .nb-back svg{width:24px;height:24px;fill:none;stroke:var(--tint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.navbar .nb-title{font-size:16px;font-weight:600;letter-spacing:1px;flex:1;text-align:center;margin-right:40px;}
.navbar .nb-right{width:40px;font-size:18px;color:var(--tint);text-align:right;cursor:pointer;background:none;border:0;padding:0;}
.content{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{width:0;}
.content.nopad{padding:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),inset 0 0 30px rgba(90,169,255,.03);}
.section-title{font-size:11px;color:var(--text-3);letter-spacing:3px;margin:18px 0 8px;padding-left:4px;}
.section-title:first-child{margin-top:0;}
.chat-item{display:flex;gap:12px;padding:12px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer;}
.chat-item:active{background:var(--card-2);}
.chat-item .av{width:44px;height:44px;border-radius:14px;background:linear-gradient(160deg,#2b5fb0,#16233a);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;flex:0 0 auto;}
.chat-item .av.mom{background:linear-gradient(160deg,#9e6b8a,#3a1f33);}
.chat-item .av.sys{background:linear-gradient(160deg,#5aa9ff,#1e3a66);}
.chat-item .av.grp{background:linear-gradient(160deg,#5b8e6f,#1e3a2a);}
.chat-item .ci-body{flex:1;min-width:0;}
.chat-item .ci-name{font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.chat-item .ci-name span.t{font-size:11px;color:var(--text-3);flex:0 0 auto;}
.chat-item .ci-prev{font-size:12px;color:var(--text-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-item .badge2{background:var(--red);color:#fff;font-size:10px;border-radius:8px;padding:1px 6px;margin-left:6px;}
.msg-list{display:flex;flex-direction:column;gap:12px;padding-bottom:12px;}
.msg{max-width:78%;align-self:flex-start;padding:10px 14px;background:var(--card-2);border-radius:16px;
  border-bottom-left-radius:4px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.msg.me{align-self:flex-end;background:linear-gradient(160deg,var(--tint-2),var(--tint));color:#fff;
  border-radius:16px;border-bottom-right-radius:4px;}
.msg.sys{align-self:center;background:transparent;color:var(--text-3);font-size:11px;padding:4px 8px;
  border:1px solid var(--line);border-radius:8px;text-align:center;max-width:88%;}
.msg.notice{align-self:stretch;max-width:100%;background:rgba(90,169,255,.08);border:1px solid var(--tint);
  color:var(--ice);font-size:13px;border-radius:12px;cursor:pointer;padding:12px 14px;}
.msg .mt{display:block;font-size:10px;color:var(--text-3);margin-top:6px;text-align:right;}
.msg.me .mt{color:rgba(255,255,255,.7);}
.msg-form{flex:0 0 auto;padding:10px 16px 24px;background:rgba(15,26,46,.85);border-top:1px solid var(--line);
  display:flex;gap:10px;align-items:center;}
.msg-form input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 16px;
  color:var(--text);font-size:14px;outline:none;}
.msg-form input:disabled{color:var(--text-3);opacity:.7;}
.msg-form .send{width:40px;height:40px;border-radius:50%;background:var(--tint-2);border:0;color:#fff;
  font-size:16px;cursor:pointer;opacity:.4;flex:0 0 auto;}
.choices{display:flex;flex-direction:column;gap:8px;padding:12px 16px 24px;background:rgba(15,26,46,.9);
  border-top:1px solid var(--line);flex:0 0 auto;}
.choice-btn{background:rgba(90,169,255,.1);border:1px solid var(--tint);color:var(--ice);
  padding:12px 16px;border-radius:12px;font-size:14px;text-align:left;cursor:pointer;line-height:1.5;
  transition:background .15s;font-family:inherit;}
.choice-btn:active{background:rgba(90,169,255,.3);}
.board-tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line);flex:0 0 auto;}
.board-tabs::-webkit-scrollbar{display:none;}
.board-tab{flex:0 0 auto;padding:6px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-size:12px;color:var(--text-2);cursor:pointer;font-family:inherit;}
.board-tab.on{background:var(--tint);color:#04101f;border-color:var(--tint);font-weight:600;}
.post-item{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
.post-item:active{background:var(--card);}
.post-item .pi-title{font-size:14px;font-weight:600;line-height:1.45;}
.post-item .pi-meta{font-size:11px;color:var(--text-3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
.post-item .pi-hot{color:var(--orange);}
.post-detail{padding:16px;}
.post-detail .pd-title{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:8px;}
.post-detail .pd-meta{font-size:11px;color:var(--text-3);margin-bottom:16px;}
.post-detail .pd-body{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
.comment{padding:12px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.7;}
.comment .cm-from{color:var(--tint);font-size:12px;margin-bottom:4px;}
.comment .cm-reply{color:var(--text-2);font-size:12px;}
.post-locked{margin-top:16px;padding:12px;background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);
  border-radius:10px;text-align:center;color:var(--red);font-size:12px;}
.rule-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.rule-card.danger{border-color:rgba(255,90,90,.45);background:rgba(255,90,90,.05);}
.rule-card .rc-num{color:var(--tint);font-weight:700;margin-right:6px;}
.rule-card.danger .rc-num{color:var(--red);}
.rule-card p{margin:8px 0 0;font-size:14px;line-height:1.85;color:var(--text);}
.rule-card.danger p{color:#ffb0b0;}
.rule-meta{font-size:12px;color:var(--text-3);margin-bottom:14px;line-height:1.8;
  padding:12px;background:rgba(90,169,255,.04);border-radius:10px;border:1px solid var(--line);}
.rule-meta b{color:var(--text-2);}
.note-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.note-card .nc-time{font-size:11px;color:var(--text-3);margin-bottom:8px;font-family:"SF Mono",Menlo,monospace;}
.note-card .nc-body{font-size:14px;line-height:1.9;white-space:pre-wrap;color:var(--text);}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;
  border-bottom:1px solid var(--line);font-size:14px;gap:12px;}
.setting-row .sr-label{color:var(--text);flex:0 0 auto;}
.setting-row .sr-val{color:var(--text-2);font-size:13px;text-align:right;}
.btn{display:inline-block;padding:10px 20px;border-radius:12px;border:1px solid var(--tint);
  background:rgba(90,169,255,.1);color:var(--ice);font-size:14px;cursor:pointer;font-family:inherit;}
.btn.danger{border-color:var(--red);color:var(--red);background:rgba(255,90,90,.06);}
.btn.primary{background:linear-gradient(160deg,var(--tint),var(--tint-2));color:#04101f;border-color:transparent;font-weight:600;}
.btn.block{display:block;width:100%;text-align:center;margin-top:10px;}
.btn.small{padding:6px 14px;font-size:12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;
  color:var(--text-3);font-size:13px;text-align:center;line-height:1.8;}
#overlays{position:absolute;inset:0;z-index:80;pointer-events:none;}
#overlays.on{pointer-events:auto;}
.modal-bg{position:absolute;inset:0;background:rgba(2,4,10,.72);backdrop-filter:blur(4px);}
.modal{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.8);max-height:80%;overflow-y:auto;}
.modal h3{margin:0 0 12px;font-size:16px;}
.modal p{margin:0 0 18px;font-size:13px;line-height:1.7;color:var(--text-2);white-space:pre-wrap;}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end;}
.notice-pop{position:absolute;top:56px;left:14px;right:14px;background:rgba(22,35,58,.97);
  border:1px solid var(--tint);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.7),var(--glow);
  animation:dropIn .35s var(--ease);cursor:pointer;z-index:81;pointer-events:auto;}
@keyframes dropIn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.notice-pop .np-app{font-size:11px;color:var(--tint);letter-spacing:2px;}
.notice-pop .np-title{font-size:14px;font-weight:600;margin-top:4px;}
.notice-pop .np-body{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.5;}
#toasts{position:absolute;left:0;right:0;bottom:100px;z-index:120;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none;}
.toast{background:rgba(22,35,58,.96);border:1px solid var(--line);border-radius:20px;padding:10px 20px;
  font-size:13px;color:var(--text);animation:dropIn .25s var(--ease);max-width:80%;text-align:center;}
.caret{display:inline-block;width:7px;height:15px;background:var(--tint);vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:2px;}
/* 校园通 */
.id-card{background:linear-gradient(160deg,#1d3a66,#0f1f3a);border:1px solid rgba(127,216,255,.3);
  border-radius:16px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px;}
.id-card::after{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(127,216,255,.15),transparent 70%);}
.id-card .id-name{font-size:20px;font-weight:700;letter-spacing:1px;}
.id-card .id-line{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.7;}
.id-card .id-no{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--ice);margin-top:12px;letter-spacing:1px;}
.menu-list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;}
.menu-item:last-child{border-bottom:0;}
.menu-item:active{background:var(--card-2);}
.menu-item .mi-arrow{margin-left:auto;color:var(--text-3);font-size:16px;}
.menu-item .mi-ic{width:30px;height:30px;border-radius:8px;background:rgba(90,169,255,.15);display:flex;
  align-items:center;justify-content:center;color:var(--tint);font-size:14px;flex:0 0 auto;}
.schedule-day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.schedule-day .sd-title{font-size:13px;color:var(--tint);font-weight:600;margin-bottom:8px;}
.schedule-day .sd-courses{display:flex;flex-wrap:wrap;gap:6px;}
.schedule-day .sd-course{font-size:12px;background:var(--card-2);border-radius:6px;padding:4px 10px;color:var(--text-2);}
.health-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
.health-card .hc-temp{font-size:42px;font-weight:200;color:var(--ice);font-variant-numeric:tabular-nums;}
.health-card .hc-label{font-size:12px;color:var(--text-3);margin-top:6px;letter-spacing:2px;}
.calendar-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;}
.calendar-item .cal-date{color:var(--tint);flex:0 0 auto;font-family:"SF Mono",Menlo,monospace;font-size:12px;}
.ticket-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
.ticket-item .ti-title{font-size:14px;font-weight:600;}
.ticket-item .ti-meta{font-size:11px;color:var(--text-3);margin-top:6px;display:flex;justify-content:space-between;}
.ticket-item .ti-status{color:var(--orange);}
/* 天气 */
.temp-big{font-size:64px;font-weight:100;color:var(--ice);text-align:center;line-height:1;letter-spacing:-2px;
  text-shadow:0 0 40px rgba(127,216,255,.4);margin:10px 0 4px;}
.temp-desc{text-align:center;font-size:13px;color:var(--text-2);margin-bottom:18px;}
.warn-bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue-warn),var(--yellow),var(--orange),var(--red));
  margin-bottom:6px;position:relative;}
.warn-bar .wb-dot{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px rgba(255,255,255,.8);transition:left .3s;}
.warn-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-bottom:18px;}
.hourly{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
.hourly::-webkit-scrollbar{display:none;}
.hour-cell{flex:0 0 auto;text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;min-width:58px;}
.hour-cell .hc-t{font-size:11px;color:var(--text-3);}
.hour-cell .hc-v{font-size:14px;color:var(--ice);margin-top:4px;font-weight:600;}
.chart-svg{width:100%;height:140px;display:block;}
/* 门禁 */
.log-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center;}

let saveTimer=null;
function deepMerge(base,over){
  if(Array.isArray(base))return Array.isArray(over)?over:base;
  if(base&&typeof base==="object"&&over&&typeof over==="object"){
    const out={};
    Object.keys(base).forEach(k=>{out[k]=over.hasOwnProperty(k)?deepMerge(base[k],over[k]):base[k];});
    Object.keys(over).forEach(k=>{if(!base.hasOwnProperty(k))out[k]=over[k];});
    return out;
  }
  return over===undefined?base:over;
}

  });
  if(!d.story.vars)d.story.vars=clone(def.story.vars);
  if(!d.packs)d.packs={};
  d.v=DATA_VERSION;
  return d;
}
function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw){const d=buildSeed(defaultData());saveData(d);return d;}
    return migrate(deepMerge(defaultData(),JSON.parse(raw)));
  }catch(e){console.error(e);return buildSeed(defaultData());}
}
function saveData(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d||D));}catch(e){console.error(e);}}

function restartBootTyping(){

/* ==================== 天气 ==================== */
function renderWeather(){
  const current=D.weather.hourly[0]?D.weather.hourly[0].v:-18;
  const warnIdx=Math.min(3,Math.max(0,D.world.weatherWarning==="蓝色"?0:D.world.weatherWarning==="黄色"?1:D.world.weatherWarning==="橙色"?2:3));
  const warnLeft=warnIdx*33.3;
  const hourly=D.weather.hourly.map(h=>`<div class="hour-cell"><div class="hc-t">${esc(h.t)}</div><div class="hc-v">${h.v}°</div></div>`).join("");
  const hist=D.weather.history;
  const minV=Math.min(...hist.map(h=>h.v))-2,maxV=Math.max(...hist.map(h=>h.v))+2;
  const W=300,H=120;
  const pts=hist.map((h,i)=>`${(i/(hist.length-1))*W},${H-((h.v-minV)/(maxV-minV))*H}`).join(" ");
  const chart=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="rgba(127,216,255,.35)"/><stop offset="100%" stop-color="rgba(127,216,255,0)"/>
    </linearGradient></defs>
    <polyline points="${pts}" fill="none" stroke="var(--ice)" stroke-width="2"/>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#wg)"/>
  </svg>`;
  return `<div id="page">${nav("天气")}
    <div class="content">
      <div class="temp-big">${current}°</div>
      <div class="temp-desc">小雪 · 北风 4 级 · 湿度 78%</div>
      <div class="section-title">预警等级</div>
      <div class="warn-bar"><div class="wb-dot" style="left:calc(${warnLeft}% - 7px)"></div></div>
      <div class="warn-label"><span>蓝</span><span>黄</span><span>橙</span><span>红</span></div>
      <div class="section-title">逐小时温度</div>
      <div class="hourly">${hourly}</div>
      <div class="section-title">近8日温度曲线</div>
      <div class="card" style="padding:8px 4px">
        ${chart}
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);padding:4px 8px 0">
          ${hist.map(h=>`<span>${esc(h.d.replace("5月",""))}</span>`).join("")}
        </div>
      </div>
      <div class="section-title">预警详情</div>
      <div class="card" style="font-size:13px;line-height:1.85;color:var(--text-2)">
        渠京市气象台 ${esc(D.world.currentTime.slice(0,10))} 发布寒潮${esc(D.world.weatherWarning)}预警：受强冷空气影响，本市气温将持续下降至 -18℃ 以下，请广大师生注意防寒保暖。
      </div>
    </div>
  </div>`;
}

/* ==================== 通知 ==================== */
function pushNotice(app,title,body,onClick){
  S.noticeQueue.push({app,title,body,onClick});
  showNextNotice();
}
function showNextNotice(){
  if(S.noticeShowing||S.noticeQueue.length===0)return;
  S.noticeShowing=true;
  const n=S.noticeQueue.shift();
  const el=document.createElement("div");
  el.className="notice-pop";
  el.innerHTML=`<div class="np-app">${esc(n.app)}</div>
    <div class="np-title">${esc(n.title)}</div>
    <div class="np-body">${esc(n.body)}</div>`;
  el.onclick=()=>{
    el.remove();S.noticeShowing=false;
    if(n.onClick)n.onClick();
    setTimeout(showNextNotice,240);
  };
  $("#overlays").appendChild(el);
  $("#overlays").classList.add("on");
  setTimeout(()=>{
    if(el.parentNode){el.remove();S.noticeShowing=false;showNextNotice();}
  },7000);
}

/* ==================== 动作分发 ==================== */
const ACTIONS={};

ACTIONS.openPad=function(){S.padOpen=true;render();};
ACTIONS.padKey=function(el){padKey(el.dataset.k);};

ACTIONS.openApp=function(el){openApp(el.dataset.app);};
function openApp(id){
  if(id==="school"){goHome();pushPage("school");}
  else if(id==="chat"){goHome();pushPage("chat");if(D.story.step==="toChat"){D.story.step="chatRead";save();}}
  else if(id==="forum"){goHome();pushPage("forum");}
  else if(id==="rules"){goHome();pushPage("rules");setTimeout(triggerRuleAfter,600);}
  else if(id==="weather"){goHome();pushPage("weather");}
  else if(id==="access"){goHome();pushPage("access");}
  else if(id==="contacts"){goHome();pushPage("contacts");}
  else if(id==="notes"){
    goHome();pushPage("notes");
    if(D.story.step==="toNotes"&&!D.story.vars.notesRead){startNoteTyping();}
  }
  else if(id==="settings"){goHome();pushPage("settings");}
}

ACTIONS.goHome=function(){goHome();};
ACTIONS.popPage=function(){popPage();};

ACTIONS.openChat=function(el){
  const id=el.dataset.id;
  S.currentChatId=id;
  const c=D.chats.find(x=>x.id===id);
  if(c)c.unread=0;
  pushPage("chat:"+id);
  save();
  if(id==="c_north"&&D.story.step==="chatRead"&&!D.story.vars.groupChoice1){
    setTimeout(triggerGroupChoice1,300);
  }
  if(id==="c_north"&&D.story.step==="ch1End"){
    setTimeout(afterRulesRead,400);
  }
};

ACTIONS.openRules=function(){goHome();pushPage("rules");setTimeout(triggerRuleAfter,600);};
ACTIONS.openExistingChat=function(el){
  const id=el.dataset.id;
  goHome();pushPage("chat");pushPage("chat:"+id);
};

ACTIONS.chooseStory=function(el){
  const i=parseInt(el.dataset.i,10);
  const pending=D.story.pending;
  if(!pending||!pending.choices[i]||!pending.choices[i].fn)return;
  const fn=pending.choices[i].fn;
  pending.choices[i].fn=null;
  fn();
};

ACTIONS.forumTab=function(el){S.currentBoard=el.dataset.b;render();};
ACTIONS.openPost=function(el){
  S.currentPostId=el.dataset.id;
  pushPage("forum:"+S.currentPostId);
};

ACTIONS.schoolSub=function(el){
  pushPage("school:"+el.dataset.k);
};

ACTIONS.healthSign=function(){
  const h=D.healthChecks[0];
  if(h.status==="已打卡"){toast("今天已经打过卡了");return;}
  h.status="已打卡";h.temp="36.6";
  save();render();
  toast("打卡成功");
};

ACTIONS.openContact=function(el){pushPage("contacts:"+el.dataset.id);};

ACTIONS.toastOnly=function(el){toast(el.dataset.msg||"暂不可用");};

ACTIONS.toggleReduce=function(){
  D.settings.reduceMotion=!D.settings.reduceMotion;
  document.documentElement.dataset.reduceMotion=D.settings.reduceMotion?"1":"0";
  save();render();
};
ACTIONS.saveNow=function(){save(true);toast("已保存");};
ACTIONS.exportSave=function(){
  const blob=new Blob([JSON.stringify(D)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="hanchao-save-"+Date.now()+".json";
  a.click();
  toast("存档已导出");
};
ACTIONS.resetGame=function(){
  confirmBox("重置游戏","将清除所有本地存档，从头开始。确定吗？",()=>{
    localStorage.removeItem(STORE_KEY);
    D=buildSeed(defaultData());
    saveData(D);
    S.booted=false;S.locked=true;S.padBuf="";S.padOpen=false;
    S.stack=[];bootReady=false;
    render();restartBootTyping();
  });
};

/* 开发者入口 */
let devCount=0,devTimer=null;
ACTIONS.devTap=function(){
  devCount++;
  clearTimeout(devTimer);
  devTimer=setTimeout(()=>{devCount=0;},1200);
  if(devCount>=5){
    devCount=0;
    modal(`<h3>开发者面板</h3><p>剧情步骤：${esc(D.story.step)}\n信任值：${esc(JSON.stringify(D.story.vars))}\n数据版本：${DATA_VERSION}</p>
      <div class="m-actions">
        <button class="btn" onclick="closeModal()">关闭</button>
        <button class="btn danger" onclick="devReset()">重置剧情</button>
      </div>`);
  }else{
    toast("再点"+(5-devCount)+"次");
  }
};
window.devReset=function(){
  D.story=clone(defaultData().story);
  D.chats=D.chats.filter(c=>c.id!=="c_north"||true);
  save(true);closeModal();toast("剧情已重置");render();
};

/* ==================== 弹窗 ==================== */
function toast(msg,ms){
  const el=document.createElement("div");
  el.className="toast";
  el.textContent=msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>{el.remove();},ms||1800);
}
function modal(html){
  const ov=$("#overlays");
  ov.classList.add("on");
  ov.innerHTML=`<div class="modal-bg" onclick="closeModal()"></div><div class="modal">${html}</div>`;
}
function closeModal(){
  const ov=$("#overlays");
  ov.classList.remove("on");ov.innerHTML="";
  S.noticeShowing=false;setTimeout(showNextNotice,200);
}
window.closeModal=closeModal;
function confirmBox(title,text,cb){
  modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p>
    <div class="m-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn danger" id="confirm-yes">确定</button>
    </div>`);
  $("#confirm-yes").onclick=()=>{closeModal();cb();};
}
window.confirmBox=confirmBox;

/* ==================== 全局事件 ==================== */
document.addEventListener("click",e=>{
  // 开机点击
  if(!S.booted&&bootReady&&e.target.closest("#boot")){
    S.booted=true;S.locked=true;S.padOpen=false;
    D.story.step="lock";
    save(true);bootReady=false;render();
    return;
  }
  // 锁屏点击（非 pad）
  if(S.locked&&!S.padOpen&&e.target.closest("#lock")){
    S.padOpen=true;render();return;
  }
  // data-action 委托
  const el=e.target.closest("[data-action]");
  if(!el)return;
  const fn=ACTIONS[el.dataset.action];
  if(!fn)return;
  e.preventDefault();
  try{fn(el,e);}catch(err){console.error(err);toast("操作失败");}
},true);

window.addEventListener("beforeunload",()=>save(true));
window.addEventListener("resize",()=>{
  const scale=Math.min(1,(window.innerHeight-40)/844,(window.innerWidth-20)/390);
  $("#phone").style.transform="scale("+scale+")";
});

/* ==================== 启动 ==================== */
function boot(){
  document.documentElement.dataset.reduceMotion=D.settings.reduceMotion?"1":"0";
  const scale=Math.min(1,(window.innerHeight-40)/844,(window.innerWidth-20)/390);
  $("#phone").style.transform="scale("+scale+")";

  // 是否已有进行中的存档
  if(D.story.step&&!["boot","lock"].includes(D.story.step)&&D.story.step!==null){
    S.booted=true;S.locked=false;
    if(D.story.step==="toNotes"&&!D.story.vars.notesRead){
      S.stack=[];render();startNoteTyping();
    }else{
      S.stack=[];render();
      if(D.story.step==="toChat"||D.story.step==="toForum"||D.story.step==="toRules"||D.story.step==="ch1End")handleStoryTick();
    }
    startTimeTick();
    return;
  }
  render();
  restartBootTyping();
}

/* 启动时如已读到"rulesRead"但还没选，恢复群聊选项 */
function handleStoryTick(){
  if(D.story.step==="toChat"&&!D.story.vars.groupChoice1){
    // 等待玩家进群
  }
  if(D.story.step==="toForum"&&D.story.vars.forumRead&&!D.story.pending){
    // 等待玩家从帖子返回
  }
  if(D.story.step==="rulesRead"&&!D.story.vars.groupChoice2){
    // 等待玩家读规则
  }
}

boot();
</script>
</body>
