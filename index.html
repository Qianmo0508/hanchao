<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f7">
<title>寒潮预警</title>
<style>
/* ============================================================
   设计 Token
   ============================================================ */
:root{
  --c-bg:#eef0f5;
  --c-bg-2:#ffffff;
  --c-card:#ffffff;
  --c-card-2:#f6f7fa;
  --c-text:#0b0c10;
  --c-text-2:#6b7280;
  --c-text-3:#9ca3af;
  --c-line:rgba(0,0,0,.08);
  --c-accent:#2f6bff;
  --c-accent-soft:rgba(47,107,255,.12);
  --c-danger:#e5484d;
  --c-warn:#f5a524;
  --c-green:#19a974;
  --c-bubble-me:#2f6bff;
  --c-bubble-me-text:#ffffff;
  --c-bubble-them:#ffffff;
  --c-bubble-them-text:#0b0c10;
  --c-scrim:rgba(0,0,0,.42);

  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(0,0,0,.06);
  --sh-2:0 8px 24px rgba(0,0,0,.12);
  --sh-3:0 24px 64px rgba(0,0,0,.30);

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --fs-xs:11px; --fs-s:13px; --fs-m:15px; --fs-l:17px; --fs-xl:22px; --fs-xxl:36px;

  --z-base:1; --z-nav:50; --z-sheet:200; --z-guide:300; --z-banner:400;
  --z-choice:600; --z-toast:800; --z-modal:900;

  --ease:cubic-bezier(.2,.8,.2,1);
  --dur:180ms;

  --sb-h:42px;
  --hb-h:20px;
}
html[data-theme="dark"]{
  --c-bg:#0b0c10;
  --c-bg-2:#111318;
  --c-card:#171a20;
  --c-card-2:#1e222a;
  --c-text:#f2f4f8;
  --c-text-2:#9aa3b2;
  --c-text-3:#6b7280;
  --c-line:rgba(255,255,255,.10);
  --c-accent-soft:rgba(90,140,255,.18);
  --c-bubble-them:#20242c;
  --c-bubble-them-text:#f2f4f8;
  --c-scrim:rgba(0,0,0,.6);
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 8px 24px rgba(0,0,0,.55);
  --sh-3:0 24px 64px rgba(0,0,0,.75);
}

/* ============================================================
   基础
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--c-bg);
  color:var(--c-text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:var(--fs-m);
}
@media (min-width:521px){ body{ background:#000; } }

button{font-family:inherit;font-size:inherit;color:inherit;}
input{font-family:inherit;}

#app{
  position:relative;
  width:100%;
  max-width:520px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--c-bg);
  overflow:hidden;
  isolation:isolate;
}

/* 状态栏 */
#statusbar{
  flex:0 0 auto;
  height:calc(var(--sb-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) var(--sp-5) 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:var(--fs-s);
  font-weight:600;
  letter-spacing:.02em;
  position:relative;
  z-index:var(--z-nav);
  user-select:none;
  color:var(--c-text);
  transition:color var(--dur) var(--ease);
}
body[data-screen="boot"] #statusbar{ color:#e8e8e8; }
#statusbar .sb-left{ flex:0 0 auto; font-variant-numeric:tabular-nums; }
#statusbar .sb-right{ flex:0 0 auto; display:flex; align-items:center; gap:5px; }
#statusbar svg{ display:block; }
.sb-battery{ position:relative; width:22px; height:11px; border:1.4px solid currentColor; border-radius:3px; opacity:.9; }
.sb-battery::after{ content:""; position:absolute; right:-3.5px; top:3px; width:2px; height:5px; background:currentColor; border-radius:0 1px 1px 0; opacity:.6;}
.sb-battery i{ position:absolute; left:1px; top:1px; bottom:1px; width:70%; background:currentColor; border-radius:1px; display:block;}
.sb-bars{ display:flex; align-items:flex-end; gap:1.5px; height:11px; }
.sb-bars b{ display:block; width:2.5px; background:currentColor; border-radius:1px; opacity:.95;}
.sb-bars b:nth-child(1){height:4px} .sb-bars b:nth-child(2){height:6px} .sb-bars b:nth-child(3){height:8px} .sb-bars b:nth-child(4){height:11px}

/* 视口 */
#viewport{ flex:1 1 auto; position:relative; overflow:hidden; min-height:0; }

/* Home 指示条 */
#homebar{
  flex:0 0 auto;
  height:calc(var(--hb-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex; align-items:center; justify-content:center;
  background:transparent;
  z-index:var(--z-nav);
}
#homebar .indicator{
  width:118px; height:5px; border-radius:3px;
  background:var(--c-text); opacity:.22;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
#homebar:active .indicator{ opacity:.4; transform:scale(.94); }
body[data-screen="boot"] #homebar .indicator{ background:#fff; opacity:.2; }

/* 页面 */
.page{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  background:var(--c-bg);
  min-width:0;
  animation:pageIn var(--dur) var(--ease);
}
@keyframes pageIn{
  from{ opacity:.4; transform:translate3d(18px,0,0); }
  to{ opacity:1; transform:translate3d(0,0,0); }
}
.page-body{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-bottom:var(--sp-4);
  min-height:0;
  scrollbar-width:none;
}
.page-body::-webkit-scrollbar{ display:none; }

/* 导航栏 */
.navbar{
  flex:0 0 auto;
  min-height:48px;
  display:flex; align-items:center;
  gap:var(--sp-1);
  padding:0 var(--sp-2);
  border-bottom:1px solid var(--c-line);
  background:var(--c-bg-2);
  position:relative;
  z-index:2;
}
.navbar .nav-title{
  flex:1 1 auto; min-width:0;
  font-size:var(--fs-l); font-weight:600; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:0 var(--sp-1);
}
.nav-side{ flex:0 0 56px; display:flex; align-items:center; }
.nav-side.right{ justify-content:flex-end; }
.nav-btn{
  min-width:44px; height:44px;
  display:flex; align-items:center; justify-content:center;
  border:none; background:none; cursor:pointer;
  color:var(--c-accent); font-size:var(--fs-m);
  border-radius:var(--r-m);
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease);
  padding:0 var(--sp-2);
  white-space:nowrap;
}
.nav-btn:active{ transform:scale(.94); background:var(--c-accent-soft); }
.nav-btn.chev{ font-size:26px; font-weight:300; line-height:1; }

/* 通用 */
.sec-title{
  font-size:var(--fs-xs); color:var(--c-text-2);
  padding:var(--sp-4) var(--sp-4) var(--sp-2);
  letter-spacing:.06em; font-weight:600;
}
.card{
  background:var(--c-card);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  margin:0 var(--sp-3) var(--sp-3);
  overflow:hidden;
}
.row{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-4);
  min-height:52px;
  border-bottom:1px solid var(--c-line);
  cursor:pointer;
  min-width:0;
  transition:background var(--dur) var(--ease);
}
.row:last-child{ border-bottom:none; }
.row:active{ background:var(--c-card-2); }
.row .r-main{ flex:1 1 auto; min-width:0; }
.row .r-title{
  font-size:var(--fs-m); font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row .r-sub{
  font-size:var(--fs-s); color:var(--c-text-2);
  margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row .r-right{
  flex:0 0 auto; font-size:var(--fs-s); color:var(--c-text-3);
  display:flex; align-items:center; gap:var(--sp-2);
  max-width:45%; min-width:0;
}
.row .r-right span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chev-r{ color:var(--c-text-3); font-size:18px; flex:0 0 auto; }

.avatar{
  flex:0 0 auto;
  width:44px; height:44px;
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  background:var(--c-card-2);
  overflow:hidden;
}
.avatar.round{ border-radius:50%; }

.badge{
  display:inline-block;
  background:var(--c-danger); color:#fff;
  font-size:10px; font-weight:700;
  min-width:17px; height:17px; line-height:17px;
  border-radius:9px; padding:0 5px; text-align:center;
}
.dot-red{
  width:9px;height:9px;border-radius:50%;background:var(--c-danger);flex:0 0 auto;
}
.tag{
  display:inline-block; font-size:10px; font-weight:700;
  padding:2px 6px; border-radius:6px;
  background:var(--c-accent-soft); color:var(--c-accent);
  white-space:nowrap;
}
.tag.hot{ background:rgba(229,72,77,.14); color:var(--c-danger); }
.tag.gray{ background:var(--c-card-2); color:var(--c-text-2); }

.empty{
  padding:var(--sp-6) var(--sp-4);
  text-align:center; color:var(--c-text-3); font-size:var(--fs-s);
}

.btn{
  display:inline-flex; align-items:center; justify-content:center;
  gap:var(--sp-2);
  min-height:44px; padding:0 var(--sp-5);
  border-radius:var(--r-m);
  border:none; cursor:pointer;
  background:var(--c-accent); color:#fff;
  font-size:var(--fs-m); font-weight:600;
  transition:transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
  position:relative; overflow:hidden;
  max-width:100%;
}
.btn:active{ transform:scale(.96); }
.btn.ghost{ background:var(--c-card-2); color:var(--c-text); }
.btn.danger{ background:var(--c-danger); }
.btn.sm{ min-height:36px; padding:0 var(--sp-4); font-size:var(--fs-s); }
.btn.block{ width:100%; }
.btn[disabled]{ opacity:.4; pointer-events:none; }

/* ============================================================
   桌面
   ============================================================ */
.home-page{ background:linear-gradient(170deg,var(--c-bg) 0%,var(--c-bg) 55%,var(--c-card-2) 100%); }
.home-widget{
  margin:var(--sp-3) var(--sp-4) var(--sp-2);
  padding:var(--sp-4);
  border-radius:var(--r-xl);
  background:var(--c-card);
  box-shadow:var(--sh-1);
  display:flex; align-items:center; gap:var(--sp-4);
  min-width:0;
}
.home-widget .w-time{ font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.home-widget .w-date{ font-size:var(--fs-xs); color:var(--c-text-2); margin-top:2px;}
.home-widget .w-right{ flex:1 1 auto; min-width:0; text-align:right; }
.home-widget .w-temp{ font-size:var(--fs-xl); font-weight:600; }
.home-widget .w-desc{ font-size:var(--fs-xs); color:var(--c-text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.home-pages{
  flex:1 1 auto;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  min-height:0;
}
.home-pages::-webkit-scrollbar{ display:none; }
.home-grid{
  flex:0 0 100%;
  scroll-snap-align:center;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:min-content;
  gap:var(--sp-3) var(--sp-1);
  padding:var(--sp-2) var(--sp-3);
  align-content:start;
  min-width:0;
}
.app-item{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:var(--sp-1) 0;
  cursor:pointer;
  border:none; background:none;
  min-width:0; width:100%;
  transition:transform var(--dur) var(--ease);
}
.app-item:active{ transform:scale(.94); }
.app-icon{
  width:52px; height:52px;
  border-radius:15px;
  display:flex; align-items:center; justify-content:center;
  font-size:26px;
  background:var(--c-card);
  box-shadow:var(--sh-1);
  position:relative;
  transition:transform var(--dur) var(--ease);
}
.app-icon .badge{
  position:absolute; top:-3px; right:-3px;
  border:2px solid var(--c-bg);
  box-sizing:content-box;
}
.app-name{
  font-size:10.5px; color:var(--c-text);
  max-width:100%;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-align:center;
  line-height:1.2;
  opacity:.85;
}
body.jiggle .app-icon{ animation:jiggle .4s infinite alternate ease-in-out; }
@keyframes jiggle{ from{transform:rotate(-1.6deg) scale(.99)} to{transform:rotate(1.6deg) scale(.99)} }

.page-dots{
  display:flex; justify-content:center; gap:6px;
  padding:var(--sp-2) 0;
  flex:0 0 auto;
}
.page-dots i{
  width:6px;height:6px;border-radius:50%;
  background:var(--c-text); opacity:.2;
  transition:opacity var(--dur) var(--ease);
}
.page-dots i.on{ opacity:.7; }

.dock{
  flex:0 0 auto;
  margin:0 var(--sp-4) var(--sp-2);
  padding:var(--sp-2) var(--sp-2);
  border-radius:var(--r-xl);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:var(--sh-1);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:var(--sp-1);
}
html[data-theme="dark"] .dock{ background:rgba(30,34,42,.6); }
.dock .app-item .app-name{ display:none; }

/* 搜索栏 */
.home-search{
  flex:0 0 auto;
  margin:var(--sp-2) var(--sp-4);
  height:38px;
  display:flex; align-items:center; gap:var(--sp-2);
  padding:0 var(--sp-3);
  border-radius:var(--r-m);
  background:rgba(120,120,128,.14);
  color:var(--c-text-2);
  font-size:var(--fs-s);
  cursor:pointer;
}
.home-search:active{ background:rgba(120,120,128,.22); }

/* ============================================================
   锁屏
   ============================================================ */
.lock-page{
  background:linear-gradient(180deg,#1a1f2c 0%,#0b0c10 60%,#05060a 100%);
  color:#fff;
  align-items:center;
  justify-content:flex-start;
  padding:var(--sp-6) var(--sp-5);
  overflow:hidden;
}
.lock-top{ text-align:center; margin-top:6vh; width:100%; }
.lock-time{
  font-size:64px; font-weight:200; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  line-height:1;
  text-shadow:0 6px 30px rgba(0,0,0,.6);
}
.lock-date{ font-size:var(--fs-m); opacity:.7; margin-top:var(--sp-2); }
.lock-handwrite{
  margin-top:var(--sp-6);
  width:100%;
  text-align:center;
  font-family:"Segoe Script","Bradley Hand","Snell Roundhand",cursive,"PingFang SC";
  font-size:var(--fs-l);
  line-height:1.9;
  color:rgba(255,255,255,.86);
  text-shadow:0 2px 14px rgba(120,180,255,.28);
  animation:handFade 3s ease-in-out infinite alternate;
}
.lock-handwrite p{ margin:0; }
@keyframes handFade{ from{opacity:.62} to{opacity:.95} }
.lock-notifs{
  margin-top:var(--sp-5);
  width:100%;
  display:flex; flex-direction:column; gap:var(--sp-2);
  max-height:30vh; overflow-y:auto; scrollbar-width:none;
}
.lock-notifs::-webkit-scrollbar{ display:none; }
.lock-notif{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:var(--r-m);
  padding:var(--sp-2) var(--sp-3);
  cursor:pointer;
  text-align:left;
  min-width:0;
  animation:notifIn .28s var(--ease);
}
.lock-notif:active{ background:rgba(255,255,255,.2); }
.lock-notif .ln-title{ font-size:var(--fs-s); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.lock-notif .ln-detail{ font-size:var(--fs-xs); opacity:.72; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
@keyframes notifIn{ from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none} }

.lock-bottom{ margin-top:auto; padding-bottom:var(--sp-4); width:100%; text-align:center; }
.lock-hint{ font-size:var(--fs-s); opacity:.55; animation:breathe 2.2s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{opacity:.35} 50%{opacity:.8} }

/* 密码层 */
.pin-layer{
  position:absolute; inset:0;
  background:rgba(6,8,14,.86);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--sp-5);
  padding:var(--sp-5);
  z-index:10;
  animation:pageIn .2s var(--ease);
}
.pin-dots{ display:flex; gap:var(--sp-4); }
.pin-dots i{
  width:14px;height:14px;border-radius:50%;
  border:1.6px solid rgba(255,255,255,.6);
  transition:all var(--dur) var(--ease);
}
.pin-dots i.on{ background:#fff; border-color:#fff; }
.pin-dots.shake{ animation:shake .4s; }
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)} 40%{transform:translateX(9px)}
  60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
}
.pin-keys{
  display:grid; grid-template-columns:repeat(3,72px);
  gap:var(--sp-3);
}
.pin-key{
  width:72px; height:72px; border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);
  color:#fff; font-size:26px; font-weight:300;
  cursor:pointer;
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.pin-key:active{ transform:scale(.92); background:rgba(255,255,255,.22); }
.pin-key.ghost{ background:transparent; border:none; font-size:var(--fs-s); }
.pin-msg{ font-size:var(--fs-s); color:rgba(255,255,255,.6); min-height:20px; }

/* ============================================================
   开场
   ============================================================ */
.page.boot{
  background:#000; color:#e9e9ea;
  justify-content:center;
  padding:var(--sp-6) var(--sp-6);
  cursor:pointer;
}
.boot-inner{ width:100%; max-width:100%; }
.boot-line{
  font-size:15px; line-height:2;
  margin:0 0 var(--sp-5);
  letter-spacing:.02em;
  opacity:.9;
  animation:pageIn .4s var(--ease);
  overflow-wrap:anywhere;
  min-width:0;
}
.boot-line.current{ color:#fff; }
.boot-hint{
  font-size:12px; color:rgba(255,255,255,.35);
  margin-top:var(--sp-5); text-align:center;
  animation:breathe 2s ease-in-out infinite;
}
.boot-skip{
  position:absolute; right:var(--sp-4); bottom:var(--sp-5);
  font-size:12px; color:rgba(255,255,255,.45);
  border:1px solid rgba(255,255,255,.2);
  background:transparent; border-radius:20px;
  padding:6px 14px; cursor:pointer;
}

/* ============================================================
   聊天
   ============================================================ */
.chat-body{
  padding:var(--sp-3) var(--sp-3) var(--sp-4);
  display:flex; flex-direction:column; gap:var(--sp-2);
}
.msg-time-sep{
  text-align:center; font-size:var(--fs-xs);
  color:var(--c-text-3); padding:var(--sp-2) 0;
}
.msg-sys{
  align-self:center;
  font-size:var(--fs-xs);
  color:var(--c-text-2);
  background:var(--c-card-2);
  border-radius:10px;
  padding:4px 10px;
  max-width:88%;
  text-align:center;
  overflow-wrap:anywhere;
  min-width:0;
}
.msg{
  display:flex; gap:var(--sp-2);
  max-width:100%;
  align-items:flex-start;
  min-width:0;
}
.msg.me{ flex-direction:row-reverse; }
.msg .msg-av{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;background:var(--c-card-2);
  margin-top:16px;
}
.msg .msg-wrap{ max-width:min(74%,420px); min-width:0; display:flex; flex-direction:column; }
.msg.me .msg-wrap{ align-items:flex-end; }
.msg .msg-name{
  font-size:10.5px; color:var(--c-text-2);
  margin:0 4px 3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:100%;
}
.bubble{
  padding:9px 12px;
  border-radius:16px;
  font-size:14.5px;
  line-height:1.5;
  background:var(--c-bubble-them);
  color:var(--c-bubble-them-text);
  box-shadow:var(--sh-1);
  overflow-wrap:anywhere;
  word-break:break-word;
  min-width:0;
  max-width:100%;
  border-bottom-left-radius:5px;
  animation:bubbleIn .22s var(--ease);
}
.msg.me .bubble{
  background:var(--c-bubble-me);
  color:var(--c-bubble-me-text);
  border-bottom-left-radius:16px;
  border-bottom-right-radius:5px;
}
@keyframes bubbleIn{ from{opacity:0;transform:translateY(6px) scale(.98)} to{opacity:1;transform:none} }
.bubble .link{
  color:#2f6bff; text-decoration:underline; cursor:pointer;
}
.msg.me .bubble .link{ color:#dbe6ff; }
.bubble .recall{ color:var(--c-text-3); font-style:italic; }
.msg-time{ font-size:10px; color:var(--c-text-3); margin:3px 4px 0; }

/* 公众号卡片 */
.gzh-card{
  width:min(78%,340px);
  background:var(--c-card);
  border-radius:var(--r-m);
  box-shadow:var(--sh-1);
  padding:var(--sp-3);
  cursor:pointer;
  min-width:0;
  border:1px solid var(--c-line);
}
.gzh-card .g-title{ font-size:var(--fs-s); font-weight:700; color:var(--c-accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.gzh-card .g-desc{ font-size:var(--fs-s); margin-top:5px; color:var(--c-text); overflow-wrap:anywhere; line-height:1.45;}
.gzh-card .g-time{ font-size:10px; color:var(--c-text-3); margin-top:6px;}

/* 聊天输入 */
.chat-input{
  flex:0 0 auto;
  padding:var(--sp-2) var(--sp-3);
  padding-bottom:max(var(--sp-2), env(safe-area-inset-bottom));
  border-top:1px solid var(--c-line);
  background:var(--c-bg-2);
  display:flex; align-items:center; gap:var(--sp-2);
  min-height:56px;
  z-index:var(--z-choice);
  position:relative;
}
.input-fake{
  flex:1 1 auto; min-width:0;
  height:38px;
  border-radius:19px;
  background:var(--c-card-2);
  display:flex; align-items:center;
  padding:0 var(--sp-4);
  color:var(--c-text-3);
  font-size:var(--fs-m);
  cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border:1px solid var(--c-line);
}
.input-fake.dead{ cursor:default; opacity:.65; }
.input-fake:active:not(.dead){ background:var(--c-line); }

.choice-bar{
  flex:0 0 auto;
  padding:var(--sp-2) var(--sp-3) max(var(--sp-2), env(safe-area-inset-bottom));
  border-top:1px solid var(--c-line);
  background:var(--c-bg-2);
  display:flex; flex-direction:column; gap:var(--sp-2);
  z-index:var(--z-choice);
  position:relative;
  animation:choiceIn .24s var(--ease);
}
@keyframes choiceIn{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
.choice-btn{
  width:100%;
  min-height:46px;
  border-radius:var(--r-m);
  border:1.5px solid var(--c-accent);
  background:var(--c-accent-soft);
  color:var(--c-accent);
  font-size:14.5px; font-weight:600;
  padding:var(--sp-2) var(--sp-4);
  cursor:pointer;
  text-align:left;
  overflow-wrap:anywhere;
  min-width:0;
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease);
  animation:pageIn .2s var(--ease);
}
.choice-btn:active{ transform:scale(.97); background:var(--c-accent); color:#fff; }
.choice-btn[disabled]{ opacity:.5; pointer-events:none; }

/* ============================================================
   论坛
   ============================================================ */
.forum-tabs{
  display:flex; gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-3) var(--sp-2);
  overflow-x:auto; scrollbar-width:none;
  flex:0 0 auto;
}
.forum-tabs::-webkit-scrollbar{display:none}
.ftab{
  flex:0 0 auto;
  padding:6px 14px; border-radius:16px;
  font-size:var(--fs-s); font-weight:600;
  background:var(--c-card); color:var(--c-text-2);
  border:none; cursor:pointer;
  white-space:nowrap;
  transition:all var(--dur) var(--ease);
}
.ftab.on{ background:var(--c-accent); color:#fff; }

.post-item{
  margin:0 var(--sp-3) var(--sp-2);
  padding:var(--sp-3) var(--sp-4);
  background:var(--c-card);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  cursor:pointer;
  min-width:0;
  transition:transform var(--dur) var(--ease);
}
.post-item:active{ transform:scale(.99); }
.post-head{ display:flex; align-items:center; gap:var(--sp-2); min-width:0; }
.post-author{ font-size:var(--fs-xs); color:var(--c-text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.post-title{
  font-size:var(--fs-m); font-weight:600;
  margin:var(--sp-2) 0 4px;
  overflow-wrap:anywhere;
  line-height:1.4;
}
.post-meta{ font-size:var(--fs-xs); color:var(--c-text-3); display:flex; gap:var(--sp-3); flex-wrap:wrap; }

.floor{
  padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--c-line);
  min-width:0;
}
.floor:last-child{ border-bottom:none; }
.floor-head{ display:flex; align-items:center; gap:var(--sp-2); margin-bottom:5px; min-width:0;}
.floor-user{ font-size:var(--fs-s); font-weight:600; color:var(--c-accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.floor-num{ font-size:var(--fs-xs); color:var(--c-text-3); flex:0 0 auto; }
.floor-body{ font-size:14.5px; line-height:1.55; overflow-wrap:anywhere; min-width:0; }
.quote{ color:var(--c-accent); }
.locked-tip{
  margin:var(--sp-3) var(--sp-3) var(--sp-5);
  padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r-m);
  background:var(--c-card-2);
  color:var(--c-text-2);
  font-size:var(--fs-s);
  text-align:center;
  overflow-wrap:anywhere;
}

/* ============================================================
   公告文档
   ============================================================ */
.notice-doc{
  margin:var(--sp-3);
  padding:var(--sp-5) var(--sp-4);
  background:var(--c-card);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  min-width:0;
}
.notice-doc h2{
  font-size:17px; text-align:center; margin:0 0 var(--sp-3);
  line-height:1.5; overflow-wrap:anywhere;
}
.notice-meta{
  font-size:var(--fs-xs); color:var(--c-text-2);
  text-align:center; line-height:1.9;
  padding-bottom:var(--sp-3);
  border-bottom:1px dashed var(--c-line);
  margin-bottom:var(--sp-4);
  overflow-wrap:anywhere;
}
.notice-sec{
  font-size:14.5px; line-height:1.85;
  margin-bottom:var(--sp-3);
  overflow-wrap:anywhere;
  min-width:0;
}
.notice-sec b{ font-weight:700; }
.notice-sec.red{ color:var(--c-danger); font-weight:600; }
.notice-sign{
  text-align:right; font-size:var(--fs-s);
  color:var(--c-text-2); line-height:1.9;
  margin-top:var(--sp-5); padding-top:var(--sp-3);
  border-top:1px dashed var(--c-line);
}

/* ============================================================
   备忘录
   ============================================================ */
.memo-item{
  margin:0 var(--sp-3) var(--sp-2);
  padding:var(--sp-3) var(--sp-4);
  background:var(--c-card);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  cursor:pointer;
  min-width:0;
  transition:transform var(--dur) var(--ease);
}
.memo-item:active{ transform:scale(.99); }
.memo-title{ font-size:var(--fs-m); font-weight:600; overflow-wrap:anywhere; }
.memo-preview{
  font-size:var(--fs-s); color:var(--c-text-2); margin-top:4px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; overflow-wrap:anywhere; line-height:1.5;
}
.memo-meta{ font-size:var(--fs-xs); color:var(--c-text-3); margin-top:6px; display:flex; gap:var(--sp-2); flex-wrap:wrap; }
.typewriter-area{
  margin:var(--sp-3);
  padding:var(--sp-5) var(--sp-4);
  background:var(--c-card);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  font-size:15.5px; line-height:2;
  min-height:220px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  min-width:0;
}
.tw-cursor{
  display:inline-block; width:2px; height:1em;
  background:var(--c-accent);
  vertical-align:text-bottom;
  animation:blink .9s steps(1) infinite;
  margin-left:1px;
}
@keyframes blink{ 50%{opacity:0} }

/* ============================================================
   天气 / 门禁 / 校园通 / 规则
   ============================================================ */
.weather-hero{
  margin:var(--sp-3);
  padding:var(--sp-6) var(--sp-4);
  border-radius:var(--r-xl);
  background:linear-gradient(160deg,#2b3a5c,#0f1626);
  color:#fff;
  text-align:center;
  box-shadow:var(--sh-2);
  min-width:0;
}
.weather-hero .w-city{ font-size:var(--fs-m); opacity:.8; }
.weather-hero .w-big{ font-size:64px; font-weight:200; line-height:1.05; margin:var(--sp-2) 0; letter-spacing:-.03em;}
.weather-hero .w-cond{ font-size:var(--fs-m); opacity:.9; }
.weather-hero .w-extra{ font-size:var(--fs-xs); opacity:.65; margin-top:var(--sp-3); }
.alert-box{
  margin:0 var(--sp-3) var(--sp-3);
  padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r-m);
  background:rgba(229,72,77,.12);
  border:1px solid rgba(229,72,77,.3);
  color:var(--c-danger);
  font-size:var(--fs-s);
  line-height:1.6;
  overflow-wrap:anywhere;
}
.hourly{
  display:flex; gap:var(--sp-2);
  overflow-x:auto; scrollbar-width:none;
  padding:0 var(--sp-3) var(--sp-3);
}
.hourly::-webkit-scrollbar{display:none}
.hour-cell{
  flex:0 0 auto;
  width:60px;
  padding:var(--sp-2) 0;
  border-radius:var(--r-m);
  background:var(--c-card);
  text-align:center;
  font-size:var(--fs-xs);
  box-shadow:var(--sh-1);
}
.hour-cell .t{ color:var(--c-text-2); }
.hour-cell .v{ font-size:var(--fs-m); font-weight:600; margin-top:4px; }
.hour-cell.abn .v{ color:var(--c-danger); }

.data-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--c-line);
  font-size:var(--fs-s);
  min-width:0;
}
.data-row:last-child{border-bottom:none}
.data-row .k{ color:var(--c-text-2); flex:0 0 auto; }
.data-row .v{ text-align:right; min-width:0; overflow-wrap:anywhere; }

/* 规则中心 */
.rule-card{
  margin:0 var(--sp-3) var(--sp-3);
  padding:var(--sp-4);
  background:var(--c-card);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  min-width:0;
  cursor:pointer;
  transition:transform var(--dur) var(--ease);
}
.rule-card:active{ transform:scale(.99); }
.rule-card .rc-head{ display:flex; align-items:center; gap:var(--sp-2); min-width:0; }
.rule-card .rc-title{ font-size:var(--fs-m); font-weight:600; flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.rule-item{
  padding:var(--sp-3) 0;
  border-bottom:1px dashed var(--c-line);
  font-size:14.5px; line-height:1.7;
  overflow-wrap:anywhere;
  min-width:0;
}
.rule-item:last-child{ border-bottom:none; }
.rule-item .rn{ color:var(--c-accent); font-weight:700; margin-right:6px; }
.rule-item.abn{ color:var(--c-danger); }
.mark-btn{
  display:inline-flex; align-items:center; gap:4px;
  border:1px solid var(--c-line);
  background:var(--c-card-2);
  border-radius:14px; padding:3px 10px;
  font-size:var(--fs-xs); color:var(--c-text-2);
  cursor:pointer; margin-top:6px;
  min-height:28px;
}
.mark-btn.on{ background:var(--c-accent-soft); color:var(--c-accent); border-color:transparent; }

/* ============================================================
   设置
   ============================================================ */
.settings-group{ margin-bottom:var(--sp-4); }
.settings-val{ color:var(--c-text-2); font-size:var(--fs-s); }

/* ============================================================
   遮罩层 / 通知 / Toast / 弹窗
   ============================================================ */
#layers{
  position:absolute; inset:0;
  pointer-events:none;
  z-index:var(--z-banner);
  overflow:hidden;
}

/* 通知横幅 */
.notif-banner{
  position:absolute;
  top:calc(var(--sb-h) + env(safe-area-inset-top) - 6px);
  left:var(--sp-2); right:var(--sp-2);
  background:rgba(250,250,252,.94);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-radius:var(--r-l);
  box-shadow:var(--sh-2);
  padding:var(--sp-3) var(--sp-4);
  pointer-events:auto;
  cursor:pointer;
  z-index:var(--z-banner);
  animation:bannerIn .26s var(--ease);
  border:1px solid rgba(0,0,0,.05);
  min-width:0;
}
html[data-theme="dark"] .notif-banner{
  background:rgba(32,36,44,.94);
  border-color:rgba(255,255,255,.08);
}
@keyframes bannerIn{ from{opacity:0; transform:translateY(-110%)} to{opacity:1;transform:none} }
.notif-banner.leaving{ animation:bannerOut .24s var(--ease) forwards; }
@keyframes bannerOut{ to{opacity:0; transform:translateY(-110%)} }
.notif-banner.slim{ padding:var(--sp-2) var(--sp-3); }
.notif-banner .nb-title{
  font-size:var(--fs-s); font-weight:700;
  color:var(--c-text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  min-width:0;
}
.notif-banner .nb-detail{
  font-size:var(--fs-xs); color:var(--c-text-2);
  margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  min-width:0;
}
.notif-banner.shake-it{ animation:bannerShake .12s 2; }
@keyframes bannerShake{
  0%,100%{transform:translateX(0)} 50%{transform:translateX(2px)}
}

/* Toast */
.toast{
  position:absolute;
  left:50%; bottom:14%;
  transform:translateX(-50%);
  background:rgba(20,22,28,.92);
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  font-size:var(--fs-s);
  max-width:min(86vw,420px);
  text-align:center;
  pointer-events:none;
  z-index:var(--z-toast);
  animation:toastIn .2s var(--ease);
  overflow-wrap:anywhere;
  line-height:1.5;
}
@keyframes toastIn{ from{opacity:0;transform:translate(-50%,10px)} to{opacity:1;transform:translate(-50%,0)} }
.toast.out{ animation:toastOut .2s var(--ease) forwards; }
@keyframes toastOut{ to{opacity:0;transform:translate(-50%,10px)} }

/* 模态 */
.modal-scrim{
  position:absolute; inset:0;
  background:var(--c-scrim);
  pointer-events:auto;
  z-index:var(--z-modal);
  display:flex; align-items:center; justify-content:center;
  padding:var(--sp-4);
  animation:fadeIn .18s var(--ease);
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal{
  width:min(92vw,420px);
  background:var(--c-bg-2);
  border-radius:var(--r-xl);
  padding:var(--sp-5);
  box-shadow:var(--sh-3);
  animation:modalIn .24s var(--ease);
  max-height:80vh;
  display:flex; flex-direction:column;
  min-width:0;
}
@keyframes modalIn{ from{opacity:0;transform:scale(.94)} to{opacity:1;transform:none} }
.modal h3{ margin:0 0 var(--sp-3); font-size:var(--fs-l); overflow-wrap:anywhere; }
.modal .m-body{
  font-size:var(--fs-s); color:var(--c-text-2); line-height:1.7;
  overflow-y:auto; overflow-wrap:anywhere; min-width:0;
  margin-bottom:var(--sp-4);
}
.modal .m-actions{ display:flex; gap:var(--sp-2); justify-content:flex-end; flex-wrap:wrap; }

/* 底部弹窗 */
.sheet-scrim{
  position:absolute; inset:0;
  background:var(--c-scrim);
  pointer-events:auto;
  z-index:var(--z-sheet);
  display:flex; align-items:flex-end;
  animation:fadeIn .18s var(--ease);
}
.sheet{
  width:100%;
  background:var(--c-bg-2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--sp-4) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));
  animation:sheetIn .24s var(--ease);
  max-height:78vh; overflow-y:auto; min-width:0;
}
@keyframes sheetIn{ from{transform:translateY(100%)} to{transform:none} }
.sheet-title{ font-size:var(--fs-l); font-weight:600; text-align:center; margin-bottom:var(--sp-3); }

/* 光标指引 */
.cursor-guide{
  position:absolute;
  font-size:30px;
  pointer-events:none;
  z-index:var(--z-guide);
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));
  animation:guideFloat 1.1s ease-in-out infinite, guideBlink .3s 2;
  transition:opacity .3s var(--ease);
  will-change:transform;
}
@keyframes guideFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes guideBlink{ 0%,100%{opacity:1} 50%{opacity:.2} }

/* 通知中心 / 控制中心 */
.panel-scrim{
  position:absolute; inset:0;
  background:var(--c-scrim);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  pointer-events:auto;
  z-index:var(--z-sheet);
  display:flex; flex-direction:column;
  animation:fadeIn .18s var(--ease);
}
.panel{
  background:var(--c-bg-2);
  border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:var(--sp-4) var(--sp-3) var(--sp-4);
  max-height:70vh;
  overflow-y:auto;
  animation:panelIn .24s var(--ease);
  min-width:0;
}
@keyframes panelIn{ from{transform:translateY(-100%)} to{transform:none} }
.panel-title{ font-size:var(--fs-s); font-weight:700; color:var(--c-text-2); padding:0 var(--sp-2) var(--sp-2); }
.cc-grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-2);
  padding:0 var(--sp-1);
}
.cc-tile{
  display:flex; align-items:center; gap:var(--sp-2);
  padding:var(--sp-3);
  border-radius:var(--r-m);
  background:var(--c-card-2);
  border:none; cursor:pointer;
  font-size:var(--fs-s); color:var(--c-text);
  min-height:52px;
  transition:all var(--dur) var(--ease);
  text-align:left; min-width:0;
}
.cc-tile:active{ transform:scale(.96); }
.cc-tile.on{ background:var(--c-accent); color:#fff; }
.cc-tile .cc-ico{ font-size:18px; flex:0 0 auto; }
.cc-tile .cc-label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.cc-slider{
  padding:var(--sp-2) var(--sp-1);
}
.cc-slider label{ font-size:var(--fs-xs); color:var(--c-text-2); display:flex; justify-content:space-between; }
.cc-slider input[type=range]{ width:100%; accent-color:var(--c-accent); height:32px; }

/* 多任务 */
.task-card{
  margin:0 var(--sp-3) var(--sp-3);
  padding:var(--sp-4);
  background:var(--c-card);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  cursor:pointer;
  min-width:0;
}

/* 开发者面板 */
.dev-input, .dev-textarea, .dev-select{
  width:100%;
  background:var(--c-card-2);
  border:1px solid var(--c-line);
  border-radius:var(--r-m);
  padding:var(--sp-2) var(--sp-3);
  font-size:var(--fs-s);
  color:var(--c-text);
  min-height:40px;
  outline:none;
  min-width:0;
}
.dev-textarea{ min-height:120px; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.5; resize:vertical; }
.dev-label{ font-size:var(--fs-xs); color:var(--c-text-2); margin:var(--sp-3) 0 var(--sp-1); font-weight:600; }

/* 错误页 */
.error-page{
  display:flex; flex-direction:column; align-items:center; justify-content:center;

const STORE_KEY = 'xiaoqu_save_v1';

function freshState() {
  return {
    version: DATA.version,
    theme: 'light',
    route: [{ page: 'boot', params: {} }],
    clockBase: Date.parse('2025-05-08T18:00:00'),

    trust: { 周学姐: 0, 邓许: 0, 临爽: 0, 苏青: 0, 沈敏: 0, 许双荞: 0, 张夏夏: 0 },
    flags: {},
    notifications: [],
    readNotifs: {},
    unread: {},
    settings: {
      vibrate: true,
      bugEnabled: true,
      bugNotify: true,
      bugCursor: true,
      bugType: true,
      bugTime: true,
      lockPassword: '1234',
      devPassword: '202380'
    },
    db: clone(DATA.db),
    choice: null,
    devUnlocked: false,
    markedRules: {}
  };
}

let state = freshState();
let saveTimer = null;

const Store = {
  save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        const snapshot = Object.assign({}, state);
        snapshot.choice = null;
        localStorage.setItem(STORE_KEY, JSON.stringify(snapshot));
      } catch (e) { /* 忽略存储异常 */ }
    }, 250);
  },
  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return null;
      return migrate(s);
    } catch (e) { return null; }
  },
  clear() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }
};

/* 数据迁移函数（版本升级入口） */
function migrate(s) {
  const target = freshState();
  // 合并缺失字段
  const merged = Object.assign({}, target, s);
  merged.settings = Object.assign({}, target.settings, s.settings || {});
  merged.db = Object.assign({}, target.db, s.db || {});
  merged.trust = Object.assign({}, target.trust, s.trust || {});
  merged.version = DATA.version;
  if (!Array.isArray(merged.route) || !merged.route.length) merged.route = [{ page: 'home', params: {} }];
  return merged;
}

function save() { Store.save(); }
function flag(k, v) {
  if (v === undefined) return state.flags[k];
  state.flags[k] = v;
  save();
  return v;
}

const NotifService = {
  push(n) {
    // 去重：同一 id 只出现一次
    if (state.notifications.some(x => x.id === n.id)) {
      return false;
    }
    const item = Object.assign({}, n, { time: Date.now(), read: false });
    state.notifications.unshift(item);
    if (state.notifications.length > 60) state.notifications.length = 60;
    save();
    this.banner(item);
    if (state.route[state.route.length - 1].page === 'lock') render();
    return true;
  },
  banner(n) {
    const layers = $('#layers');
    if (!layers) return;
    // 移除已有横幅
    $$('.notif-banner', layers).forEach(b => b.remove());
    const el = document.createElement('div');
    el.className = 'notif-banner' + (state.choice ? ' slim' : '');
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.innerHTML = `
      <div class="nb-title">${esc(n.title)}</div>
      <div class="nb-detail">${esc(n.detail || '')}</div>`;
    layers.appendChild(el);

    // 仿 bug：轻微抖动
    if (state.settings.bugEnabled && state.settings.bugNotify) {
      setTimeout(() => {
        el.classList.add('shake-it');
        setTimeout(() => el.classList.remove('shake-it'), 260);
      }, 60);
    }

    let dismissed = false;
    const dismiss = () => {
      if (dismissed) return;
      dismissed = true;
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 260);
    };

    const activate = () => {
      dismiss();
      NotifService.markRead(n.id);
      if (n.target && n.target.page) {
        Router.push(n.target.page, n.target.params || {});
      }
    };
    el.addEventListener('click', activate);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') activate(); });

    setTimeout(dismiss, 4200);
  },
  markRead(id) {
    state.readNotifs[id] = true;
    const it = state.notifications.find(x => x.id === id);
    if (it) it.read = true;
    save();
  },
  unreadCount() {
    return state.notifications.filter(n => !n.read).length;
  }
};

/* 打字机 */
const Typewriter = {
  _skip: null,
  async run(el, text, opts) {
    opts = opts || {};
    const speed = opts.speed || 26;
    el.textContent = '';
    el.style.minHeight = (el.style.minHeight || '0');
    return new Promise(resolve => {
      let i = 0;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        el.textContent = text;
        Typewriter._skip = null;
        resolve();
      };
      Typewriter._skip = finish;
      const tick = () => {
        if (done) return;
        if (i >= text.length) { finish(); return; }
        // 仿 bug：偶尔卡顿
        let step = 1;
        if (state.settings.bugEnabled && state.settings.bugType && Math.random() < 0.02) {
          step = 0; // 卡一下
        }
        i += step;
        el.textContent = text.slice(0, i);
        setTimeout(tick, speed + (step === 0 ? 180 : 0));
      };
      tick();
    });
  },
  skip() { if (this._skip) this._skip(); }
};

/* 光标指引 */
const CursorGuide = {
  current: null,
  show(selector, label) {
    this.hide();
    const target = document.querySelector(selector);
    if (!target) return;
    const layers = $('#layers');
    if (!layers) return;
    const el = document.createElement('div');
    el.className = 'cursor-guide';
    el.textContent = '👆';
    el.setAttribute('aria-hidden', 'true');
    layers.appendChild(el);
    this.current = { el, selector };
    const place = () => {
      const t = document.querySelector(selector);
      if (!t) { this.hide(); return; }
      const r = t.getBoundingClientRect();
      const appR = $('#app').getBoundingClientRect();
      const x = r.left - appR.left + r.width / 2 - 16;
      const y = r.bottom - appR.top + 4;
      el.style.left = Math.max(4, Math.min(appR.width - 36, x)) + 'px';
      el.style.top = Math.max(4, Math.min(appR.height - 44, y)) + 'px';
    };
    place();
    setTimeout(place, 60);
    if (label) {
      Toast.show(label, 2600);
    }
  },
  hide() {
    if (this.current) {
      this.current.el.remove();
      this.current = null;
    }
  }
};

/* 路由 */
const Router = {
  push(page, params) {
    CursorGuide.hide();
    state.route.push({ page, params: params || {} });
    save();
    render();
  },
  pop() {
    if (state.route.length > 1) {
      state.route.pop();
      save();
      render();
    }
  },
  replace(page, params) {
    state.route[state.route.length - 1] = { page, params: params || {} };
    save();
    render();
  },
  root(page) {
    state.route = [{ page: page || 'home', params: {} }];
    save();
    render();
  },
  current() { return state.route[state.route.length - 1]; }
};

/* 信任值 */
function addTrust(names, delta) {
  names.forEach(n => {
    state.trust[n] = (state.trust[n] || 0) + delta;
  });
  save();
}
function trustNote(names, delta) {
  const arrow = delta > 0 ? '↑+' : '↓';
  return '［' + names.join('、') + '信任值' + arrow + (delta > 0 ? delta : delta) + '］';
}

    mount(root) {

          const hint = $('#boot-hint', root);
          if (hint) hint.textContent = '轻触屏幕，拿起这部手机';
        }
      };

      const page = root.querySelector('.boot');
      page.addEventListener('click', e => {
        if (e.target.closest('.boot-skip')) return;

        <div class="lock-date">${now.getMonth() + 1}月${now.getDate()}日 ${WEEK_CN[now.getDay()]}</div>
      </div>

        <p>陈默……看到它了么？</p>
        <p>密码是 1234，打开吧</p>
        <p>你会知道你想知道的内容</p>
      </div>
      <div class="lock-notifs">${notifHtml}</div>
      <div class="lock-bottom">
        <div class="lock-hint">上滑解锁</div>
      </div>
    </div>`,
    mount(root) {
      const page = $('#lock-page', root);
      let startY = null;
      let unlocked = false;

      const openPin = () => {
        if (unlocked) return;
        unlocked = true;
        showPin(root);
      };

      page.addEventListener('pointerdown', e => {
        if (e.target.closest('.lock-notif')) return;
        startY = e.clientY;
      });
      page.addEventListener('pointerup', e => {
        if (startY == null) return;
        const dy = e.clientY - startY;
        startY = null;
        if (dy < -50) openPin();
      });
      page.addEventListener('pointercancel', () => { startY = null; });
      // 桌面端点击也可解锁
      page.addEventListener('click', e => {
        if (e.target.closest('.lock-notif')) return;
        if (window.matchMedia('(pointer:fine)').matches) openPin();
      });
    }
  };
};

function showPin(root) {
  const container = root.querySelector('.lock-page');
  if (!container) return;
  let entered = '';
  const layer = document.createElement('div');
  layer.className = 'pin-layer';
  layer.innerHTML = `
    <div class="pin-msg" id="pin-msg">输入锁屏密码</div>
    <div class="pin-dots" id="pin-dots">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="pin-keys" id="pin-keys">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-key" data-k="${n}">${n}</button>`).join('')}
      <button class="pin-key ghost" data-k="cancel">取消</button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key ghost" data-k="del">⌫</button>
    </div>`;
  container.appendChild(layer);

  const dots = $$('#pin-dots i', layer);
  const msg = $('#pin-msg', layer);

  const refresh = () => {
    dots.forEach((d, i) => d.classList.toggle('on', i < entered.length));
  };

  const fail = () => {
    const box = $('#pin-dots', layer);
    box.classList.add('shake');
    msg.textContent = '密码错误，请重试';
    entered = '';
    refresh();
    vibrate(30);
    setTimeout(() => box.classList.remove('shake'), 420);
  };

  const tryUnlock = () => {
    const pwd = state.settings.lockPassword || '1234';
    if (entered === pwd) {
      layer.remove();
      onUnlockSuccess();
    } else {
      fail();
    }
  };

  layer.addEventListener('click', e => {
    const btn = e.target.closest('[data-k]');
    if (!btn) return;
    const k = btn.dataset.k;
    if (k === 'del') { entered = entered.slice(0, -1); refresh(); return; }
    if (k === 'cancel') { layer.remove(); return; }
    if (entered.length >= 4) return;
    entered += k;
    refresh();
    vibrate(6);
    if (entered.length === 4) setTimeout(tryUnlock, 160);
  });
}

function onUnlockSuccess() {
  Router.root('home');
  if (!flag('unlockedOnce')) {
    flag('unlockedOnce', true);
    setTimeout(() => {
      NotifService.push({
        id: 'n_memo_first',
        title: '系统提示（系统消息）',
        detail: '备忘录有一条新记录',

      });
    }, 1400);
  }
}

function lastMsgTime(c) {
  if (!c.messages || !c.messages.length) return '1970-01-01 00:00';
  return c.messages[c.messages.length - 1].time || '1970-01-01 00:00';
}
function shortTime(t) {
  if (!t) return '';
  const parts = String(t).split(' ');
  return parts[1] || t;
}

function pushMsg(cid, msg) {
  const chat = state.db.chats[cid];
  if (!chat) return;
  if (!chat.messages) chat.messages = [];
  const m = Object.assign({ id: uid('msg') }, msg);
  chat.messages.push(m);
  if (msg.from !== 'me' && msg.type !== 'system') {
    const cur = Router.current();
    if (!(cur.page === 'chat' && cur.params.id === cid)) {
      state.unread[cid] = (state.unread[cid] || 0) + 1;
    }
  }
  save();
  return m;
}

const StoryEngine = {
  async runNode(node) {
    if (!node || !Array.isArray(node.actions)) return;
    for (const act of node.actions) {
      await this.exec(act);
    }
  },
  async exec(act) {
    switch (act.type) {
      case 'delay':
        await sleep(act.ms || 500);
        break;
      case 'notify':
        NotifService.push({
          id: act.id || uid('n'),
          title: act.title || '',
          detail: act.detail || '',
          target: act.target || null
        });
        break;
      case 'addMsg':
        pushMsg(act.chat, { from: act.from, text: act.text, time: storyTime() });
        refreshChat(act.chat);
        break;
      case 'trust':
        addTrust(act.names || [], act.delta || 0);
        break;
      case 'setFlag':
        flag(act.key, act.value);
        break;
      case 'unlockApp':
        // 所有 APP 默认解锁，此处保留扩展点
        break;
      case 'goto':
        Router.push(act.page, act.params || {});
        break;
      case 'choice':
        state.choice = { chatId: act.chat, nodeId: act.node, options: act.options || [] };
        refreshChat(act.chat);
        break;
      default:
        break;
    }
  }
};

function triggerStory(id) {
  const node = STORY[id];
  if (!node) return;
  if (node.once && flag('story_' + id)) return;
  if (node.once) flag('story_' + id, true);
  StoryEngine.runNode(node);
}

/* 打开聊天时的钩子 */
function onOpenChat(cid) {
  if (cid === 'by') {
    const chat = state.db.chats.by;
    if (chat.joined === false) {
      chat.joined = true;
      if (!chat.messages.length) {
        chat.messages.push({ id: uid('m'), type: 'system', text: '“王晓歌”被拉入群聊', time: '2025-05-08 18:02' });
      }
      save();
      setTimeout(() => render(), 30);
    }
    // 第 4 幕群消息
    if (flag('invited') && !flag('grp1msgs')) {
      flag('grp1msgs', true);
      setTimeout(() => runGroup1(), 600);
    }
    // 第 8 幕
    if (flag('pending_s8') && !flag('s8msgs')) {
      flag('pending_s8', false);
      flag('s8msgs', true);
      setTimeout(() => runScene8Msgs(), 700);
    }
  }
}

/* ---------------------------------------------------------------
   10. 事件委托
   --------------------------------------------------------------- */
async function handleAction(action, el) {
  switch (action) {
    case 'back':
      Router.pop();
      break;
    case 'home':
      Router.root('home');
      break;
    case 'open-app': {
      const id = el.dataset.app;
      CursorGuide.hide();
      if (id === 'messages') Router.push('messages');
      else if (id === 'campus') Router.push('campus');
      else if (id === 'forum') Router.push('forum');
      else if (id === 'rules') Router.push('rules');
      else if (id === 'weather') Router.push('weather');
      else if (id === 'access') Router.push('access');
      else if (id === 'memos') Router.push('memos');
      else if (id === 'settings') Router.push('settings');
      else Router.push('simpleApp', { id });
      break;
    }
    case 'open-search':
      Router.push('search');
      break;
    case 'open-chat':
      Router.push('chat', { id: el.dataset.id });
      break;
    case 'open-contact':
      Router.push('contact', { id: el.dataset.id });
      break;
    case 'open-moments':
      Router.push('moments', { id: el.dataset.id });
      break;
    case 'open-contacts':
      Router.push('contacts');
      break;
    case 'open-friend-requests':
      Router.push('friendRequests');
      break;
    case 'open-post':
      Router.push('forumPost', { id: el.dataset.id });
      break;
    case 'open-memo':
      Router.push('memoDetail', { id: el.dataset.id });
      break;
    case 'open-rule':
      Router.push('ruleDetail', { id: el.dataset.id });
      break;
    case 'open-dev-gate':
      Router.push('about');
      break;
    case 'forum-board':
      forumBoard = el.dataset.id;
      render();
      break;
    case 'forum-post-tip':
      Toast.show('发帖功能已被校园网限制，请使用预设内容。');
      break;
    case 'access-filter':
      accessFilter = el.dataset.id;
      render();
      break;
    case 'mark-rule': {
      const key = el.dataset.key;
      state.markedRules[key] = !state.markedRules[key];
      save();
      render();
      break;
    }
    case 'tw-skip':
      Typewriter.skip();
      break;
    case 'send-blocked': {
      const cid = el.dataset.chat;
      const chat = state.db.chats[cid];
      if (!chat) break;
      if (chat.silent) { /* 文件传输助手：点击无反应 */ break; }
      Toast.show(chat.warn || '寒潮期间禁止与校外人员通讯');
      vibrate(12);
      break;
    }
    case 'gzh-card':
      Toast.show('公众号内容仅可阅读。');
      break;
    case 'jump': {
      const page = el.dataset.page;
      let params = {};
      try { params = JSON.parse(el.dataset.params || '{}'); } catch (e) {}
      Router.push(page, params);
      break;
    }
    case 'choose': {
      const key = el.dataset.key;
      await handleChoice(key);
      break;
    }
    case 'notif-jump': {
      const id = el.dataset.id;
      const n = state.notifications.find(x => x.id === id);
      if (n) {
        NotifService.markRead(id);
        if (n.target && n.target.page) Router.push(n.target.page, n.target.params || {});
      }
      break;
    }
    case 'fr-accept': {
      const id = el.dataset.id;
      const fr = state.db.friendRequests.find(x => x.id === id);
      if (fr && fr.status === 'pending') {
        fr.status = 'accepted';
        const c = state.db.contacts.find(x => x.name === fr.from);
        if (c) c.hidden = false;
        if (!state.db.chats[fr.from === '临爽' ? 'ls' : fr.from]) {
          // 确保会话存在
          if (fr.from === '临爽') {
            state.db.chats.ls = {
              id: 'ls', type: 'private', name: '临爽', avatar: '😆',
              canSend: false, warn: '寒潮期间禁止与校外人员通讯',
              messages: []
            };
          }
        }
        save();
        Toast.show('已通过好友申请');
        render();
      }
      break;
    }
    case 'fr-ignore': {
      const id = el.dataset.id;
      const fr = state.db.friendRequests.find(x => x.id === id);
      if (fr && fr.status === 'pending') {
        fr.status = 'ignored';
        save();
        Toast.show('已忽略');
        render();
      }
      break;
    }
    case 'set-time':
      Router.push('setTime');
      break;
    case 'apply-time': {
      const d = $('#set-date');
      const t = $('#set-time-input');
      if (d && t && d.value && t.value) {
        const dt = new Date(d.value + 'T' + t.value + ':00');
        if (!isNaN(dt.getTime())) {
          setSysTime(dt);
          Toast.show('系统时间已更新');
          Router.pop();
        }
      }
      break;
    }
    case 'toggle-theme': {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      save();
      render();
      break;
    }
    case 'toggle-vibrate': {
      state.settings.vibrate = !state.settings.vibrate;
      save();
      render();
      break;
    }
    case 'factory-reset': {
      const ok = await ConfirmBox.open({
        title: '恢复出厂设置',
        body: '该操作将清除本机全部数据与剧情进度，且不可撤销。确定继续吗？',
        okText: '确认恢复',
        danger: true
      });
      if (ok) {
        Store.clear();
        state = freshState();
        resetStoryClock();
        Router.root('boot');
        Toast.show('已恢复出厂设置');
      }
      break;
    }
    case 'chat-info':
      Toast.show('群成员信息仅管理员可见。');
      break;
    case 'phone-call':
      Toast.show('寒潮期间禁止与校外人员通讯');
      break;
    case 'stopwatch-toggle': {
      const sw = window.__sw || (window.__sw = { running: false, t0: 0, acc: 0 });
      if (sw.running) {
        sw.acc += Date.now() - sw.t0;
        sw.running = false;
        Toast.show('秒表已停止');
      } else {
        sw.t0 = Date.now();
        sw.running = true;
        Toast.show('秒表已开始');
      }
      break;
    }
    case 'calc-key': {
      const k = el.dataset.k;
      window.__calc = window.__calc || { expr: '0' };
      const c = window.__calc;
      const disp = $('#calc-display');
      if (k === 'C') c.expr = '0';
      else if (k === '⌫') c.expr = c.expr.length > 1 ? c.expr.slice(0, -1) : '0';
      else if (k === '=') {
        try {
          const safe = c.expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/%/g, '/100');
          if (/^[0-9+\-*/().\s]+$/.test(safe)) {
            const r = Function('"use strict";return (' + safe + ')')();
            c.expr = String(r);
          }
        } catch (e) { c.expr = '错误'; }
      } else {
        c.expr = c.expr === '0' && !'+-×÷'.includes(k) ? k : c.expr + k;
      }
      if (disp) disp.textContent = c.expr;
      break;
    }
    case 'music-toggle': {
      const b = $('#music-btn');
      if (b) b.textContent = b.textContent === '播放' ? '暂停' : '播放';
      break;
    }
    case 'rec-toggle': {
      const b = $('#rec-btn');
      const s = $('#rec-status');
      if (b && s) {
        const on = b.textContent === '开始录音';
        b.textContent = on ? '停止录音' : '开始录音';
        s.textContent = on ? '录音中…' : '未开始';
      }
      break;
    }
    case 'store-install':
      Toast.show('已安装「' + el.dataset.name + '」（模拟）');
      break;
    case 'browser-go':
      Toast.show('校园网外网访问已受限');
      break;
    case 'camera-shot':
      Toast.show('已保存到文件：IMG_20250508_180012.jpg');
      break;
    case 'open-mail': {
      const subject = el.dataset.subject;
      const mail = DATA.db.misc.mails.find(m => m.subject === subject);
      if (mail) {
        await ConfirmBox.open({
          title: mail.subject,
          body: mail.from + ' · ' + mail.time + '\n\n' + mail.body,
          okText: '关闭',
          cancelText: '返回'
        });
      }
      break;
    }
    /* ---------- 开发者面板 ---------- */
    case 'dev-toggle': {
      const key = el.dataset.key;
      state.settings[key] = !state.settings[key];
      save();
      render();
      break;
    }
    case 'dev-trust': {
      const name = el.dataset.name;
      const delta = parseInt(el.dataset.delta, 10) || 0;
      state.trust[name] = (state.trust[name] || 0) + delta;
      save();
      render();
      break;
    }
    case 'dev-save-flags': {
      const ta = $('#dev-flags');
      if (!ta) break;
      try {
        const obj = JSON.parse(ta.value);
        if (typeof obj !== 'object' || obj === null) throw new Error('bad');
        state.flags = obj;
        save();
        Toast.show('剧情变量已保存');
      } catch (e) {
        Toast.show('JSON 格式错误，未保存');
      }
      break;
    }
    case 'dev-save-story': {
      const ta = $('#dev-story');
      if (!ta) break;
      try {
        const obj = JSON.parse(ta.value);
        if (typeof obj !== 'object' || obj === null) throw new Error('bad');
        Object.keys(obj).forEach(k => { STORY[k] = obj[k]; });
        Toast.show('剧情节点已保存');
      } catch (e) {
        Toast.show('JSON 格式错误，未保存');
      }
      break;
    }
    case 'dev-save-pwd': {
      const lp = $('#dev-lockpwd');
      const dp = $('#dev-devpwd');
      if (lp && lp.value) state.settings.lockPassword = lp.value;
      if (dp && dp.value) state.settings.devPassword = dp.value;
      save();
      Toast.show('密码已保存');
      break;
    }
    case 'dev-export': {
      try {
        const json = JSON.stringify(state, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'xiaoqu-save.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        Toast.show('存档已导出');
      } catch (e) {
        Toast.show('导出失败');
      }
      break;
    }
    case 'dev-import': {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = () => {
        const f = input.files && input.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const obj = JSON.parse(String(reader.result));
            if (!obj || typeof obj !== 'object' || !obj.db) throw new Error('bad');
            state = migrate(obj);
            save();
            Toast.show('存档已导入');
            render();
          } catch (e) {
            Toast.show('导入失败：结构校验未通过');
          }
        };
        reader.readAsText(f);
      };
      input.click();
      break;
    }
    case 'dev-reset-story': {
      const ok = await ConfirmBox.open({
        title: '重置剧情状态',
        body: '将清空 flags、信任值、通知与聊天进度，保留手机数据。确定吗？',
        okText: '重置',
        danger: true
      });
      if (ok) {
        state.flags = {};
        state.trust = { 周学姐: 0, 邓许: 0, 临爽: 0, 苏青: 0, 沈敏: 0, 许双荞: 0, 张夏夏: 0 };
        state.notifications = [];
        state.readNotifs = {};
        state.unread = {};
        state.choice = null;
        state.db = clone(DATA.db);
        resetStoryClock();
        save();
        Toast.show('剧情状态已重置');
        Router.root('home');
      }
      break;
    }
    case 'dev-restore': {
      const ok = await ConfirmBox.open({
        title: '恢复默认数据',
        body: '将使用 DATA 常量覆盖全部数据，确定吗？',
        okText: '恢复',
        danger: true
      });

        const dev = state.devUnlocked;
        state = freshState();
        state.devUnlocked = dev;
        resetStoryClock();
        save();
        Toast.show('已恢复默认数据');
        render();
      }
      break;
    }
    case 'dev-clear': {
      const ok = await ConfirmBox.open({
        title: '清空本地存储',
        body: '将删除 localStorage 中的全部存档，页面会重新加载。',
        okText: '清空',
        danger: true
      });
      if (ok) {
        Store.clear();
        location.reload();
      }
      break;
    }
    case 'dev-clear-notif': {
      state.notifications = [];
      state.readNotifs = {};
      save();
      Toast.show('通知已清空');
      render();
      break;
    }
    case 'dev-trigger': {
      const id = el.dataset.id;
      flag('story_' + id, false);
      if (id === 'scene6') flag('readPost1', false);
      if (id === 'scene7') flag('grp2done', true);
      if (id === 'scene8') flag('readNotice', false);
      if (id === 'scene9') flag('grp3done', true);
      triggerStory(id);
      Toast.show('已触发 ' + id);
      break;
    }
    default:
      break;
  }
}

async function handleChoice(key) {
  const ch = state.choice;
  if (!ch) return;
  const node = CHOICES[ch.nodeId];
  if (!node || !node[key]) return;
  const opts = $$('.choice-btn');
  opts.forEach(b => b.setAttribute('disabled', 'disabled'));
  vibrate(10);
  try {
    await node[key]();
  } catch (e) {
    console.error(e);
    Toast.show('剧情执行异常，已跳过');
    state.choice = null;
    render();
  }
}

function openNotifCenter() {
  const layers = $('#layers');
  if (!layers || $('.panel-scrim', layers)) return;
  const scrim = document.createElement('div');
  scrim.className = 'panel-scrim';
  const list = state.notifications.slice().sort((a, b) => b.time - a.time);
  scrim.innerHTML = `<div class="panel">
    <div class="panel-title">通知中心</div>
    ${list.length ? list.map(n => `
      <div class="card" style="margin:0 0 var(--sp-2);padding:var(--sp-3) var(--sp-4);cursor:pointer;" data-notif="${esc(n.id)}">
        <div class="bold txt-s" style="overflow-wrap:anywhere;">${esc(n.title)}</div>
        <div class="txt-xs txt-2" style="margin-top:2px;overflow-wrap:anywhere;">${esc(n.detail || '')}</div>
        <div class="txt-xs txt-3" style="margin-top:4px;">${esc(new Date(n.time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }))}${n.read ? '' : ' · 未读'}</div>
      </div>`).join('') : '<div class="empty">暂无通知</div>'}
  </div>`;
  layers.appendChild(scrim);
  scrim.addEventListener('click', ev => {
    const card = ev.target.closest('[data-notif]');
    if (card) {
      const id = card.dataset.notif;
      const n = state.notifications.find(x => x.id === id);
      scrim.remove();
      if (n) {
        NotifService.markRead(id);
        if (n.target && n.target.page) Router.push(n.target.page, n.target.params || {});
      }
      return;
    }
    if (ev.target === scrim) scrim.remove();
  });
}

function openControlCenter() {
  const layers = $('#layers');
  if (!layers || $('.panel-scrim', layers)) return;
  const s = state.settings;
  const scrim = document.createElement('div');
  scrim.className = 'panel-scrim';
  scrim.innerHTML = `<div class="panel">
    <div class="panel-title">控制中心</div>
    <div class="cc-grid">
      <button class="cc-tile" data-cc="wifi"><span class="cc-ico">📶</span><span class="cc-label">WiFi</span></button>
      <button class="cc-tile" data-cc="bt"><span class="cc-ico">🔵</span><span class="cc-label">蓝牙</span></button>
      <button class="cc-tile" data-cc="air"><span class="cc-ico">✈️</span><span class="cc-label">飞行模式</span></button>
      <button class="cc-tile ${s.vibrate ? 'on' : ''}" data-cc="vib"><span class="cc-ico">📳</span><span class="cc-label">震动</span></button>
      <button class="cc-tile" data-cc="torch"><span class="cc-ico">🔦</span><span class="cc-label">手电筒</span></button>
      <button class="cc-tile" data-cc="theme"><span class="cc-ico">🌗</span><span class="cc-label">主题</span></button>
    </div>
    <div class="cc-slider">
      <label><span>亮度</span><span>80%</span></label>
      <input type="range" min="0" max="100" value="80" data-cc-slider="bright">
    </div>
    <div class="cc-slider">
      <label><span>音量</span><span>50%</span></label>
      <input type="range" min="0" max="100" value="50" data-cc-slider="volume">
    </div>
    <div style="padding:var(--sp-3) var(--sp-1) 0;">
      <button class="btn ghost block sm" data-cc="close">收起</button>
    </div>
  </div>`;
  layers.appendChild(scrim);
  scrim.addEventListener('click', ev => {
    const tile = ev.target.closest('[data-cc]');
    if (tile) {
      const k = tile.dataset.cc;
      if (k === 'close') { scrim.remove(); return; }
      if (k === 'vib') {
        state.settings.vibrate = !state.settings.vibrate;
        save();
        tile.classList.toggle('on', state.settings.vibrate);
        return;
      }
      if (k === 'theme') {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        save();
        render();
        return;
      }
      tile.classList.toggle('on');
      return;
    }
    if (ev.target === scrim) scrim.remove();
  });
}

/* 边缘返回手势 */
(function setupEdgeGesture() {
  let startX = 0, startY = 0, tracking = false;
  const vp = document.getElementById('viewport');
  document.addEventListener('pointerdown', e => {
    if (e.clientX < 24) {
      startX = e.clientX; startY = e.clientY; tracking = true;
    }
  }, { passive: true });
  document.addEventListener('pointerup', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - startX;
    const dy = Math.abs(e.clientY - startY);
    if (dx > 70 && dy < 60) {
      const cur = Router.current();
      if (cur.page !== 'home' && cur.page !== 'boot' && cur.page !== 'lock') Router.pop();
    }
  }, { passive: true });
  void vp;
})();

/* ---------------------------------------------------------------
   11. 渲染主循环
   --------------------------------------------------------------- */
function renderStatusBar() {
  const d = sysNow();
  const el = $('#sb-time');
  if (el) el.textContent = fmtHM(d);
}

function render() {
  const route = Router.current();
  const vp = $('#viewport');
  if (!vp) return;

  document.documentElement.setAttribute('data-theme', state.theme);
  document.body.setAttribute('data-screen', route.page);

  let def;
  try {
    if (route.page === 'simpleApp') {
      def = simpleAppPage(route.params.id);
    } else if (PAGES[route.page]) {
      def = PAGES[route.page](route.params || {});
    } else {
      def = PAGES.home();
    }
  } catch (err) {
    console.error(err);
    def = {
      html: `<div class="page"><div class="page-body"><div class="error-page">
        <div style="font-size:44px;">⚠️</div>
        <div class="bold">页面渲染出错</div>
        <div class="txt-s txt-2 wrap">${esc(String(err && err.message || err))}</div>
        <button class="btn" data-action="home">返回桌面</button>
      </div></div></div>`
    };
  }

  vp.innerHTML = def.html;
  if (def.mount) {
    try { def.mount(vp, route.params || {}); }
    catch (e) { console.error(e); }
  }
  renderStatusBar();
  CursorGuide.hide();
}

/* 时钟刷新 */
setInterval(() => {
  renderStatusBar();
  const big = document.getElementById('clock-big');
  if (big) big.textContent = fmtHM(sysNow());
  const sw = window.__sw;
  if (sw) {
    const el = document.getElementById('stopwatch');
    if (el) {
      const total = sw.acc + (sw.running ? Date.now() - sw.t0 : 0);
      const s = Math.floor(total / 1000);
      el.textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60) + '.' + Math.floor((total % 1000) / 100);
    }
  }
}, 500);

/* 仿 bug：时间偶发回跳 1 分钟再恢复 */
setInterval(() => {
  if (!state.settings.bugEnabled || !state.settings.bugTime) return;
  if (Math.random() > 0.12) return;
  const el = $('#sb-time');
  if (!el) return;
  const real = fmtHM(sysNow());
  const d = sysNow();
  d.setMinutes(d.getMinutes() - 1);
  el.textContent = fmtHM(d);
  setTimeout(() => { const e2 = $('#sb-time'); if (e2) e2.textContent = real; }, 900);
}, 22000);

/* 暴露补丁扩展 API */
window.GameAPI = {
  registerApp(app) { registerApp(app); },
  registerStory(nodes) { Object.assign(STORY, nodes); },
  patchData(patch) { deepMerge(DATA, patch); },
  getState() { return state; },
  setState(s) { state = migrate(s); save(); render(); },
  get DATA() { return DATA; },
  get STORY() { return STORY; },
  get AppRegistry() { return AppRegistry; },
  get Router() { return Router; },
  get Store() { return Store; },
  toast(msg) { Toast.show(msg); },
  render() { render(); }
};

function deepMerge(target, src) {
  Object.keys(src || {}).forEach(k => {
    const v = src[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      if (!target[k] || typeof target[k] !== 'object') target[k] = {};
      deepMerge(target[k], v);
    } else {
      target[k] = v;
    }
  });
  return target;
}
